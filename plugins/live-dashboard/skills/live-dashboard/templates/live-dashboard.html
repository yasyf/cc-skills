function due(stamp){
 const t=new Date(stamp).getTime();if(isNaN(t))return [String(stamp),""];
 const minutes=Math.round((t-Date.now())/60000),span=Math.abs(minutes)<60?Math.abs(minutes)+"m":(Math.abs(minutes)/60).toFixed(1)+"h";
 return minutes<0?["overdue "+span,"bad"]:[span+" left",minutes<15?"warn":""];
}
function cellHtml(col,row){
 const value=row[col.key];
 if(col.kind==="due"){if(value==null)return "<td class=\"due\"></td>";const [text,cls]=due(value);return `<td class="due ${cls}" title="${esc(pt(value))}">${esc(text)}</td>`}
 if(col.kind==="num")return `<td class="num">${esc(value??"")}</td>`;
 if(col.kind==="age")return `<td class="age" title="${esc(pt(value))}">${esc(ago(value))}</td>`;
 if(col.kind==="link")return `<td>${value==null?"":ext(row[col.key+"_url"],esc(value))}</td>`;
 if(col.kind==="badge")return `<td>${pill(value,row[col.key+"_tone"])}</td>`;
 if(col.kind==="delta"){const n=Number(value);return `<td class="num ${n>0?"ok-text":n<0?"bad-text":""}">${value==null?"":(n>0?"+":"")+esc(value)}</td>`}
 if(col.kind==="bar"){const n=Math.max(0,Math.min(1,Number(value)||0));return `<td><span class="bar" title="${Math.round(n*100)}%"><i style="width:${n*100}%"></i></span></td>`}
 const shown=Array.isArray(value)?value.join(", "):value;
 return `<td>${linkify(shown??"")}</td>`;
}
function renderTable(card,p){
 const rows=p.rows.filter(row=>matches(rowText(row)));
 const acting=card.actions.length>0;
 const head=`<tr>${p.cols.map(c=>`<th class="${c.kind==="num"?"num":""}">${esc(c.label||c.key)}</th>`).join("")}${acting?"<th></th>":""}</tr>`;
 const keep=new Set(card.phone||p.cols.filter(c=>c.phone!==false).map(c=>c.key));
 const line=row=>{
  const folded=p.cols.filter(c=>!keep.has(c.key)&&row[c.key]!=null&&row[c.key]!=="").length;
  const open=state.openRows.has(`${card.id}:${row.key}`);
  return `<tr class="${rowClass(card,row)}${open?" open":""}" data-row="${esc(row.key??"")}"${row.tone?` data-tone="${esc(row.tone)}"`:""}>${p.cols.map(c=>cellHtml(c,row).replace("<td",`<td data-label="${esc(c.label||c.key)}"${keep.has(c.key)?"":" data-more"}`)).join("")}${acting?`<td>${actionsHtml(card,row)}</td>`:""}${folded?`<td class="more-toggle" data-more-toggle>${open?"less":`+${folded} more`}</td>`:""}</tr>`;
 };
 let body="";
 if(p.group_by){
  const groups=new Map();rows.forEach(row=>{const g=String(row[p.group_by]??"");if(!groups.has(g))groups.set(g,[]);groups.get(g).push(row)});
  groups.forEach((members,name)=>{body+=`<tr class="group"><td colspan="${p.cols.length+(acting?1:0)}">${esc(name)} · ${members.length}</td></tr>`+members.map(line).join("")});
 }else body=rows.map(line).join("");
 const foot=p.footer?`<tr class="foot">${p.cols.map(c=>`<td class="${c.kind==="num"?"num":""}">${esc(p.footer[c.key]??"")}</td>`).join("")}${acting?"<td></td>":""}</tr>`:"";
 return (p.note?`<p class="note">${linkify(p.note)}</p>`:"")+(rows.length?`<table class="grid"><thead>${head}</thead><tbody>${body}${foot}</tbody></table>`:(p.note?"":`<p class="empty">${state.query?"No matching rows":"No rows"}</p>`));
}
function renderMatrix(card,p){
 const box=cmptMatrix(p);
 box.querySelectorAll("tbody tr").forEach((tr,ri)=>tr.querySelectorAll("td").forEach((td,ci)=>{const cell=(p.cells[ri]||[])[ci];if(!cell)return;if(cell.title)td.title=cell.title;if(cell.link)td.innerHTML=ext(cell.link,td.innerHTML)}));
 return box;
}
const GATE_TONE={pass:"ok",waived:"muted",open:"warn",blocked:"warn","not-run":"muted","not-created":"muted",fail:"bad"};
function renderChecklist(card,p){
 const items=p.items.filter(item=>matches(rowText(item)));
 const sub=item=>[item.blocker&&esc(item.blocker),item.owner&&"owner "+esc(item.owner),item.closes&&"closes "+linkify(item.closes)].filter(Boolean).join(" · ");
 return (p.note?`<p class="note">${linkify(p.note)}</p>`:"")+`<ul class="gates">${items.map(item=>`<li class="gate ${rowClass(card,item)}"><span>${pill(item.status,GATE_TONE[item.status])}</span><span><b>${esc(item.id)}</b> ${ext(item.link,esc(item.title))}</span>${sub(item)?`<span class="sub">${sub(item)}</span>`:""}</li>`).join("")}</ul>`+(items.length?"":`<p class="empty">No gates</p>`);
}
function renderTiles(card,p){
 return (p.note?`<p class="note">${linkify(p.note)}</p>`:"")+`<div class="tiles">${p.tiles.map(t=>{const inner=`<span class="tile-label">${esc(t.label)}</span><span class="tile-value">${esc(t.value??"—")}${t.unit?`<small>${esc(t.unit)}</small>`:""}</span>${t.hint?`<span class="tile-hint">${esc(t.hint)}</span>`:""}`;return t.link&&safeUrl(t.link)?`<a class="tile ${rowClass(card,t)}" href="${esc(t.link)}" target="_blank" rel="noopener"${t.tone?` data-tone="${esc(t.tone)}"`:""}>${inner}</a>`:`<div class="tile ${rowClass(card,t)}"${t.tone?` data-tone="${esc(t.tone)}"`:""}>${inner}</div>`}).join("")}</div>`;
}
const VIZ=n=>`var(--viz-${n%8+1})`;
function chart(series){
 const lines=series.lines.filter(l=>l.points.length),all=lines.flatMap(l=>l.points);
 if(!all.length)return `<p class="viz-empty">${esc(series.note||"No points yet")}</p>`;
 const timed=all.every(p=>typeof p[0]==="string"&&!isNaN(Date.parse(p[0])));
 const xs=all.map((p,i)=>timed?Date.parse(p[0]):Number(p[0]));
 const levels=Object.values(series.thresholds||{});
 const ys=[...all.map(p=>p[1]),...levels];
 const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(0,...ys),y1=Math.max(...ys,1);
 const W=600,H=150,L=44;
 const sx=x=>L+((x-x0)/((x1-x0)||1))*(W-L-8),sy=y=>H-(y-y0)/((y1-y0)||1)*(H-12);
 const paths=lines.map((l,k)=>`<polyline fill="none" stroke="${VIZ(k)}" stroke-width="1.8" vector-effect="non-scaling-stroke" points="${l.points.map(p=>`${sx(timed?Date.parse(p[0]):Number(p[0])).toFixed(1)},${sy(p[1]).toFixed(1)}`).join(" ")}"/>`+l.points.map(p=>`<circle cx="${sx(timed?Date.parse(p[0]):Number(p[0])).toFixed(1)}" cy="${sy(p[1]).toFixed(1)}" r="2.4" fill="${VIZ(k)}" data-tip="${esc(`${l.label}: ${number(p[1],series.unit)} · ${timed?pt(p[0]):p[0]}`)}"/>`).join("")).join("");
 const rules=Object.entries(series.thresholds||{}).map(([label,v])=>`<line x1="${L}" x2="${W-8}" y1="${sy(v)}" y2="${sy(v)}" stroke="var(--bad)" stroke-dasharray="4 3"/><text x="${W-8}" y="${sy(v)-4}" text-anchor="end" font-size="10" fill="var(--bad)">${esc(label)} ${esc(number(v,series.unit))}</text>`).join("");
 const axis=`<text x="0" y="12" font-size="10" fill="var(--muted)">${esc(number(y1,series.unit))}</text><text x="0" y="${H}" font-size="10" fill="var(--muted)">${esc(number(y0,series.unit))}</text><line x1="${L}" x2="${W-8}" y1="${H}" y2="${H}" stroke="var(--line)"/>`;
 const legend=`<div class="viz-legend">${lines.map((l,k)=>`<span class="lg"><span class="viz-sw" style="background:${VIZ(k)}"></span>${esc(l.label)} ${esc(number(l.points[l.points.length-1][1],series.unit))}</span>`).join("")}</div>`;
 return `<svg class="chart" viewBox="0 0 ${W} ${H+4}" preserveAspectRatio="none" role="img">${axis}${rules}${paths}</svg>${legend}`;
}
function renderSeries(card,p){return (p.note&&p.lines.some(l=>l.points.length)?`<p class="note">${linkify(p.note)}</p>`:"")+chart(p)}
function renderPercentiles(card,p){
 const top=Math.max(1,...p.dists.flatMap(d=>[d.p99,d.max,d.budget].filter(v=>v!=null)));
 const pct=v=>Math.min(100,v/top*100);
 const rows=p.dists.filter(d=>matches(d.label)).map(d=>{
  if(!d.n)return `<div class="dist ${rowClass(card,d)}"><span>${esc(d.label)}</span><span class="muted-text">not run${d.failures?` · ${d.failures} failed`:""}</span><span></span></div>`;
  const over=d.budget!=null&&d.p95>d.budget;
  return `<div class="dist ${over?"over":""} ${rowClass(card,d)}" data-tip="${esc(`${d.label}: n ${d.n}, p50 ${number(d.p50,d.unit)}, p95 ${number(d.p95,d.unit)}, p99 ${number(d.p99,d.unit)}, max ${number(d.max,d.unit)}${d.budget!=null?`, budget ${number(d.budget,d.unit)}`:""}${d.failures?`, ${d.failures} failed`:""}`)}"><span>${esc(d.label)}</span><span class="track"><i class="p95" style="width:${pct(d.p95)}%"></i><i class="p50" style="width:${pct(d.p50)}%"></i>${d.budget!=null?`<i class="budget" style="left:${pct(d.budget)}%"></i>`:""}</span><span class="nums">p50 ${esc(number(d.p50,d.unit))} · <b>p95 ${esc(number(d.p95,d.unit))}</b> · p99 ${esc(number(d.p99,d.unit))} · n ${d.n}${d.failures?` · <span class="bad-text">${d.failures} failed</span>`:""}</span></div>`;
 }).join("");
 return (p.note?`<p class="note">${linkify(p.note)}</p>`:"")+(rows||(p.note?"":`<p class="empty">No samples yet</p>`))+(p.history?`<h4 class="note">p95 per run</h4>`+chart(p.history):"");
}
function renderGraph(card,p){
 const children=new Map(),parent=new Map();
 p.edges.forEach(([a,b])=>{if(!children.has(a))children.set(a,[]);children.get(a).push(b);if(!parent.has(b))parent.set(b,a)});
 const byId=new Map(p.nodes.map(n=>[n.id,n])),hl=new Set(p.highlight||[]),out=[],done=new Set();
 const walk=(id,depth)=>{
  if(done.has(id))return;done.add(id);
  const n=byId.get(id),kids=children.get(id)||[];
  out.push(`<li class="node ${hl.has(id)?"hl":""} ${rowClass(card,n)}"${n.tone?` data-tone="${esc(n.tone)}"`:""}><span class="rail">${"│ ".repeat(depth)}</span><span class="dot"></span><span class="label">${ext(n.link,esc(n.label))}</span>${hl.has(id)?pill("lands now","ok"):""}</li>`);
  kids.slice(1).forEach(k=>walk(k,depth+1));
  if(kids.length)walk(kids[0],depth);
 };
 p.nodes.filter(n=>!parent.has(n.id)).forEach(n=>walk(n.id,0));
 p.nodes.forEach(n=>walk(n.id,0));
 return `<ul class="tree">${out.join("")}</ul>`;
}
function renderFeed(card,p){
 const entries=p.entries.filter(e=>matches(rowText(e)));
 return (p.note?`<p class="note">${linkify(p.note)}</p>`:"")+(entries.length?`<ul class="feed">${entries.map(e=>`<li class="entry ${rowClass(card,e)}"${e.tone?` data-tone="${esc(e.tone)}"`:""}><span class="when" title="${esc(pt(e.at))}">${esc(e.at?ago(e.at):"")}${e.latency_ms!=null?`<br>${pill("+"+seconds(e.latency_ms),"info")}`:""}</span><span class="text"><span class="who">${esc(e.actor)}</span>${linkify(e.text)} ${e.link?ext(e.link,"↗"):""}</span></li>`).join("")}</ul>`:(p.note?"":`<p class="empty">No entries yet</p>`));
}
function renderKv(card,p){return `<dl class="kv">${p.pairs.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${linkify(v??"")}</dd>`).join("")}</dl>`}
function renderSvg(card,p){const wrap=el("div","svgwrap"),svg=safeSvg(p.svg);if(svg)wrap.append(svg);else wrap.textContent="The SVG did not parse.";return wrap}
const RENDER={table:renderTable,matrix:renderMatrix,checklist:renderChecklist,tiles:renderTiles,series:renderSeries,percentiles:renderPercentiles,graph:renderGraph,feed:renderFeed,kv:renderKv,markdown:(card,p)=>`<div class="md">${mdToHtml(p.text)}</div>`,svg:renderSvg};
const CADENCE_SECONDS={"15s":15,"30s":30,"1m":60,"2m":120,"5m":300,"15m":900};
const staleSince=card=>new Date(new Date(card.as_of).getTime()+2000*(CADENCE_SECONDS[card.every]||0)).toISOString();
const STATUS_TONE={ok:"ok",pending:"muted",stale:"warn",error:"bad",hung:"bad"};
function cardNode(card){
 let node=document.getElementById("card-"+card.id);
 if(!node){
  node=el("article","card");node.id="card-"+card.id;
  node.innerHTML=`<div class="card-head"><h3></h3><span class="card-meta"></span><span class="card-tools"><button type="button" data-refresh title="Refresh now" aria-label="Refresh now">↻</button><button type="button" data-copy title="Copy as Markdown" aria-label="Copy as Markdown">⧉</button></span></div><p class="card-q" hidden></p><div class="card-error" hidden></div><div class="toast" hidden></div><div class="card-body"></div>`;
  node.dataset.card=card.id;
 }
 node.dataset.width=card.width;
 node.classList.toggle("pinned",!!card.pinned);
 node.querySelector("h3").textContent=card.title;
 node.querySelector("h3").title=`${card.use} · every ${card.every}`;
 const question=node.querySelector(".card-q");question.hidden=!card.question;question.textContent=card.question||"";
 const meta=`${card.status==="ok"?"":pill(card.status,STATUS_TONE[card.status])} <span data-tip="${esc(card.as_of?`data from ${pt(card.as_of)}${card.ms!=null?`, ran in ${seconds(card.ms)}`:""}`:"no data yet")}">${esc(card.as_of?ago(card.as_of):"")}</span>`;
 if(node.dataset.meta!==meta){node.querySelector(".card-meta").innerHTML=meta;node.dataset.meta=meta}
 const error=node.querySelector(".card-error");
 error.hidden=!(card.error||card.status==="hung"||card.status==="stale");
 error.classList.toggle("stale",card.status==="stale"&&!card.error);
 error.textContent=card.status==="hung"?`Still running past its timeout${card.error?"; last error: "+card.error:""}`:card.error||(card.status==="stale"?`Stale since ${pt(staleSince(card))}, two missed runs; the last good data is from ${pt(card.as_of)}.`:"");
 const toast=node.querySelector(".toast"),told=state.toasts[card.id];
 toast.hidden=!told;if(told){toast.textContent=told.text;toast.classList.toggle("bad",!!told.bad)}
 const body=node.querySelector(".card-body"),key=JSON.stringify([card.payload,card.actions,card.phone,state.query,state.baseline&&state.baseline[card.id],[...state.openRows].filter(k=>k.startsWith(card.id+":"))]);
 if(state.painted[card.id]!==key){
  state.painted[card.id]=key;
  if(!card.payload){body.innerHTML=`<p class="empty">${card.status==="pending"?"Waiting for the first run…":"No data"}</p>`}
  else{const out=RENDER[card.kind](card,card.payload);if(typeof out==="string")body.innerHTML=out;else body.replaceChildren(out)}
 }
 return node;
}
function place(parent,node,index){if(parent.children[index]!==node)parent.insertBefore(node,parent.children[index]||null)}
function notify(cards){
 if(state.notified===null){state.notified=new Set(JSON.parse(localStorage.getItem(notifiedKey())||"null")||[]);if(!localStorage.getItem(notifiedKey()))state.notified.first=true}
 const fresh=[];
 cards.filter(c=>c.pinned&&c.payload).forEach(card=>{(card.payload.rows||card.payload.items||card.payload.entries||[]).forEach(row=>{const id=`${card.id}:${row.key}`;if(row.key!=null&&!state.notified.has(id)){state.notified.add(id);fresh.push([card,row])}})});
 localStorage.setItem(notifiedKey(),JSON.stringify([...state.notified].slice(-500)));
 if(state.notified.first){delete state.notified.first;return}
 if(!("Notification" in window)||Notification.permission!=="granted")return;
 fresh.forEach(([card,row])=>{const n=new Notification(`${card.title}: ${row.title||row.text||row.ask||row.key}`.slice(0,NOTIFY_CHARS),{tag:`${card.id}:${row.key}`});n.onclick=()=>{focus();document.getElementById("card-"+card.id)?.scrollIntoView()}});
}
function render(){
 const d=state.data;if(!d)return;
 if(state.baseline===null)state.baseline=JSON.parse(localStorage.getItem(seenKey())||"null");
 document.title=`${d.dashboard.title||d.dashboard.id} · live`;
 $("#title").textContent=d.dashboard.title||d.dashboard.id;
 const delayed=Date.now()-Date.parse(d.generated_at)>REFRESH_MS*6;
 $("#status").className="status"+(delayed?" delayed":"");
 $("#meta").textContent=delayed?`Data from ${pt(d.generated_at)}`:`Live · ${pt(d.generated_at)}`;
 $("#layout-error").hidden=!d.layout_error;$("#layout-error-text").textContent=d.layout_error?`The layout did not load, so the last good one is serving: ${d.layout_error}`:"";
 $("#banner").hidden=!d.banner;$("#banner-text").innerHTML=d.banner?linkify(d.banner):"";
 const c=d.counts;
 $("#health").innerHTML=[["error","bad"],["hung","bad"],["stale","warn"]].filter(([k])=>c[k]).map(([k,t])=>`<button type="button" data-jump="${k}">${pill(`${c[k]} ${k}`,t)}</button>`).join("");
 $("#notify").hidden=!("Notification" in window)||Notification.permission!=="default";
 const byId=new Map(d.cards.map(card=>[card.id,card]));
 const pinned=d.cards.filter(card=>card.pinned);
 pinned.forEach((card,i)=>place($("#pinned"),cardNode(card),i));
 const keep=new Set();
 d.sections.forEach((section,si)=>{
  const sid="section-"+si+"-"+section.title.replace(/\W+/g,"-");keep.add(sid);
  let node=document.getElementById(sid);
  if(!node){node=el("details","section",`<summary><h2></h2><span class="section-note"></span></summary><div class="cards"></div>`);node.id=sid;node.open=!section.collapsed}
  place($("#sections"),node,si);
  node.querySelector("h2").textContent=section.title;
  const cards=section.cards.map(id=>byId.get(id)).filter(card=>card&&!card.pinned);
  const issues=cards.filter(card=>card.status!=="ok"&&card.status!=="pending").length;
  node.querySelector(".section-note").textContent=[section.as_of?`data as of ${pt(section.as_of)}, ${ago(section.as_of)}`:"no data yet",issues?`${issues} ${issues===1?"card":"cards"} failing or stale`:""].filter(Boolean).join(" · ");
  const grid=node.querySelector(".cards");
  cards.forEach((card,i)=>place(grid,cardNode(card),i));
  [...grid.children].forEach(child=>{if(!cards.some(card=>"card-"+card.id===child.id))child.remove()});
 });
 [...$("#sections").children].forEach(child=>{if(!keep.has(child.id))child.remove()});
 [...$("#pinned").children].forEach(child=>{if(!pinned.some(card=>"card-"+card.id===child.id))child.remove()});
 notify(d.cards);
}
function saveSeen(){if(state.data){localStorage.setItem(seenKey(),JSON.stringify(state.current))}}
function toast(card,text,bad){state.toasts[card]={text,bad};render();setTimeout(()=>{delete state.toasts[card];render()},8000)}
async function post(path,body){
 const r=await fetch(path,{method:"POST",headers:{"Content-Type":"application/json","X-Dashboard-Action":ACTION_TOKEN},body:JSON.stringify(body||{})});
 const text=await r.text();
 if(!r.ok)throw new Error(text.trim()||`HTTP ${r.status}`);
 return text;
}
document.addEventListener("click",async e=>{
 const t=e.target;
 const node=t.closest(".card");
 if(t.closest("[data-refresh]")&&node){try{await post(`/refresh/${encodeURIComponent(node.dataset.card)}`);toast(node.dataset.card,"Refresh queued")}catch(err){toast(node.dataset.card,err.message,true)}return}
 if(t.closest("[data-copy]")&&node){try{const r=await fetch(`/cards/${encodeURIComponent(node.dataset.card)}.md`);await navigator.clipboard.writeText(await r.text());toast(node.dataset.card,"Copied as Markdown")}catch(err){toast(node.dataset.card,err.message,true)}return}
 const fold=t.closest("[data-more-toggle]");
 if(fold&&node){const k=`${node.dataset.card}:${fold.closest("tr").dataset.row}`;state.openRows.has(k)?state.openRows.delete(k):state.openRows.add(k);render();return}
 const act=t.closest("[data-act]");
 if(act){const text=prompt(`${act.dataset.act}: add a note (optional)`);if(text===null)return;act.disabled=true;try{const out=JSON.parse(await post(`/act/${encodeURIComponent(act.dataset.card)}/${encodeURIComponent(act.dataset.act)}`,{key:act.dataset.key,text}));toast(act.dataset.card,out.message)}catch(err){toast(act.dataset.card,err.message,true)}finally{act.disabled=false}return}
 const jump=t.closest("[data-jump]");
 if(jump){const card=state.data.cards.find(c=>c.status===jump.dataset.jump);const n=card&&document.getElementById("card-"+card.id);if(n){n.closest("details")?.setAttribute("open","");n.scrollIntoView({behavior:reduced()?"auto":"smooth",block:"center"})}}
});
$("#seen").addEventListener("click",()=>{saveSeen();state.baseline=JSON.parse(JSON.stringify(state.current));render()});
$("#notify").addEventListener("click",async()=>{await Notification.requestPermission();render()});
$("#search").addEventListener("input",e=>{state.query=e.target.value;render()});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")saveSeen()});
addEventListener("pagehide",saveSeen);
const tip=$("#tip");
document.addEventListener("mouseover",e=>{const n=e.target.closest("[data-tip]");if(n){tip.textContent=n.dataset.tip;tip.classList.add("show")}});
document.addEventListener("mousemove",e=>{if(tip.classList.contains("show")){const x=Math.min(e.clientX+14,innerWidth-tip.offsetWidth-8);tip.style.left=x+"px";tip.style.top=(e.clientY+16)+"px"}});
document.addEventListener("mouseout",e=>{if(e.target.closest("[data-tip]"))tip.classList.remove("show")});
let etag="";
async function refresh(){
 try{
  const r=await fetch("/state.json",{cache:"no-store",headers:etag?{"If-None-Match":etag}:{}});
  if(r.status===304){render();return}
  if(!r.ok)throw new Error(`HTTP ${r.status}`);
  etag=r.headers.get("ETag")||"";
  state.data=await r.json();render();
 }catch(err){$("#status").className="status disconnected";$("#meta").textContent="Disconnected: "+err.message}
}
refresh();
setInterval(refresh,REFRESH_MS);
</script>
</body>
