title: Live test
sections:
  - title: Test channels
    components:
      - use: slack-feed
        id: test-channels
        width: 2
        with: {threads: []}
      - use: view
        id: live-pages
        title: Open test pages
        width: 2
        with: {file: 'pages.tsv', where: {state: '!resolved'}, columns: ['page:link', holder:badge, deadline:due, channel:link, last_activity:age]}
  - title: Results
    components:
      - use: matrix-file
        id: test-matrix
        width: 3
        with: {file: 'results.jsonl', row: stage, col: cell, value: status, link: link, detail: [defect, task, priority]}
      - use: latency-percentiles
        id: bot-latency
        width: 2
        with: {files: 'timelines/*.timeline.json', deltas_from: origin, deltas_to: [thread, triage], budgets: {thread: '120000'}}
      - use: datadog-monitors
        id: monitors
        with: {query: 'tag:"service:example"'}
  - title: Health
    collapsed: true
    components:
      - {use: dashboard-health, id: health}
