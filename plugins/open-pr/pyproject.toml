# Test harness for the open-pr plugin's scripts; nothing here ships to users.
[project]
name = "open-pr-dev"
version = "0.0.0"
description = "Test harness for the open-pr plugin scripts"
requires-python = ">=3.10"

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
