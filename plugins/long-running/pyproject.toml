[project]
name = "long-running"
version = "0.0.0"
description = "The drive's own environment, which hooks/installed.py builds with uv and every drive process runs on"
requires-python = ">=3.13"
dependencies = ["spawnllm>=0.17.7"]

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["lib", "hooks"]
