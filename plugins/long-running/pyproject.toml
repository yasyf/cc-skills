[project]
name = "long-running-dev"
version = "0.0.0"
description = "Test harness for the long-running ledger CLI"
requires-python = ">=3.13"

[tool.uv]
package = false

[dependency-groups]
dev = ["capt-hook>=12.56.0", "pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["skills/long-running/scripts", "capt-hook"]
