[project]
name = "long-running-dev"
version = "0.0.0"
description = "Test harness for the long-running ledger CLI"
requires-python = ">=3.10"

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["skills/long-running/scripts"]
