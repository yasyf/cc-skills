[project]
name = "long-running-tools"
version = "0.1.0"
description = "Long-running orchestration state and command tools"
requires-python = ">=3.13"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "long_running"
module-root = "skills/long-running/scripts"

[dependency-groups]
dev = ["capt-hook>=12.108.39", "pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["skills/long-running/scripts", "dashboard/app", "capt-hook", "../live-dashboard/skills/live-dashboard/scripts"]
