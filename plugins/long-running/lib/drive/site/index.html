<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Drive</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<aside class="side">
  <a class="brand" href="#/" aria-label="Your queue"><span class="brandmark"><i></i><i></i><i></i><i></i></span></a>
  <nav class="tabs" id="tabs" aria-label="Screens"></nav>
  <div class="side-foot">
    <button class="kbtn" id="kbtn" type="button" title="Jump to anything (⌘K)"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span>Jump</span></button>
    <button class="kbtn" id="notices" type="button" title="Turn on notifications" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 14h3l5 4V6L7 10H4z"/><path d="M16 9a4 4 0 0 1 0 6"/></svg><span>Notify</span></button>
    <span class="fresh" id="fresh" role="status"></span>
  </div>
</aside>
<div class="content">
  <header class="topbar">
    <nav class="crumb" aria-label="Where you are"><span id="brand"></span><span aria-hidden="true">/</span><strong id="crumb"></strong></nav>
    <span id="stale" class="stale" role="status" hidden></span>
    <div id="alerts" class="alerts" hidden></div>
  </header>
  <main id="main"><p class="boot" role="status">Reading the drive…</p></main>
</div>
<div id="frames"></div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<dialog id="drawer" class="drawer"></dialog>
<dialog id="reader" class="drawer reader"></dialog>
<dialog id="lightbox" class="lightbox" aria-label="Enlarged picture"></dialog>
<div id="incidents" class="incidents" popover aria-label="Open incidents"></div>
<div id="srctip" class="srctip" popover="manual" role="tooltip"></div>
<dialog id="jump" class="jump"><input id="jumpfind" type="search" placeholder="Jump to a question, change, feature or job" autocomplete="off"><ul id="jumplist"></ul></dialog>
<script src="/app.js"></script>
</body>
</html>
