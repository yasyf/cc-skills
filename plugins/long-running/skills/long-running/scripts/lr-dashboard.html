<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>long-running</title>
<style>
:root { color-scheme: light dark; --fg: #1d1d1f; --muted: #6e6e73; --line: #d2d2d7; --bg: #fbfbfd; --card: #fff; --warn: #b25000; --bad: #c4211c; --ok: #1a7f37; --accent: #0a66c2; }
@media (prefers-color-scheme: dark) { :root { --fg: #f2f2f7; --muted: #98989d; --line: #38383a; --bg: #111113; --card: #1c1c1e; --warn: #ff9f0a; --bad: #ff453a; --ok: #30d158; --accent: #64b5ff; } }
* { box-sizing: border-box; }
body { margin: 0; font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--fg); background: var(--bg); }
header { position: sticky; top: 0; z-index: 2; background: var(--bg); border-bottom: 1px solid var(--line); padding: 10px 18px; display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: baseline; }
header h1 { font-size: 16px; margin: 0; }
header .meta { color: var(--muted); }
nav { display: flex; flex-wrap: wrap; gap: 4px 12px; width: 100%; }
nav a { color: var(--accent); text-decoration: none; }
main { padding: 12px 18px 40px; display: grid; gap: 16px; }
section { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; overflow-x: auto; }
section h2 { font-size: 14px; margin: 0 0 8px; display: flex; gap: 10px; align-items: baseline; }
section h2 .count { color: var(--muted); font-weight: normal; }
h3 { font-size: 12px; margin: 12px 0 4px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
table { border-collapse: collapse; width: 100%; }
td, th { text-align: left; vertical-align: top; padding: 3px 8px 3px 0; border-bottom: 1px solid var(--line); }
th { color: var(--muted); font-weight: 600; white-space: nowrap; }
td.when, td.num { white-space: nowrap; color: var(--muted); font-variant-numeric: tabular-nums; }
td.text { min-width: 320px; word-break: break-word; }
.clip { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; }
.clip.open { display: block; }
td.lane { white-space: nowrap; }
a { color: var(--accent); }
.tag { display: inline-block; padding: 0 5px; border-radius: 4px; border: 1px solid var(--line); font-size: 11px; white-space: nowrap; }
.bad { color: var(--bad); } .warn { color: var(--warn); } .ok { color: var(--ok); } .muted { color: var(--muted); }
.errors { color: var(--bad); }
.stats { display: flex; flex-wrap: wrap; gap: 8px 20px; }
.stats div b { font-size: 18px; display: block; }
details > summary { cursor: pointer; color: var(--muted); margin-top: 6px; }
</style>
</head>
<body>
<header>
  <h1 id="title">long-running</h1>
  <span class="meta" id="meta"></span>
  <span class="errors" id="errors"></span>
  <a href="/chat" target="_blank" rel="noopener">ask</a>
  <nav id="nav"></nav>
</header>
<main id="main"></main>
<script>
const REFRESH_MS = 10000;
const ROW_LIMIT = 60;
const state = { data: null };

const esc = (value) => String(value ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const pt = (stamp) => stamp ? new Date(stamp).toLocaleString("en-US", { timeZone: "America/Los_Angeles", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }) : "";
const ago = (stamp) => {
  if (!stamp) return "";
  const minutes = Math.round((Date.now() - new Date(stamp).getTime()) / 60000);
  if (minutes < 1) return "now";
  if (minutes < 60) return `${minutes}m`;
  if (minutes < 2880) return `${Math.round(minutes / 60)}h`;
  return `${Math.round(minutes / 1440)}d`;
};
const when = (stamp, approx) => `<td class="when" title="${esc(stamp)}">${approx ? "≈" : ""}${esc(pt(stamp))} <span class="muted">${esc(ago(stamp))}</span></td>`;
const link = (href, label) => href ? `<a href="${esc(href)}" target="_blank" rel="noopener">${esc(label)}</a>` : esc(label);
const ccn = (id, label) => link(`/ccn/${id}`, label ?? id.slice(0, 8));
const inboxLink = (row) => link(`/inbox/${row.file.split("/").map(encodeURIComponent).join("/")}?line=${row.line}`, `${row.file}:${row.line}`);
const repo = () => state.data?.drive?.repo || "";
const prLink = (ref) => {
  const [owner, number] = ref.includes("#") ? ref.split("#") : [repo(), ref];
  return link(`https://github.com/${owner}/pull/${number}`, `#${number}`);
};
const prs = (row) => (row.prs || []).map(prLink).join(" ");
const tone = (value) => /fail|red|bad|lost|blocked|error|dirty|conflict/i.test(value || "") ? "bad" : /held|hold|pending|warn|stale|new|in-pr|landed-not-live/i.test(value || "") ? "warn" : /landed|live|clean|success|completed|answered|open/i.test(value || "") ? "ok" : "muted";
const clip = (value) => `<div class="clip">${esc(value)}</div>`;
const tag = (value) => value ? `<span class="tag ${tone(value)}">${esc(value)}</span>` : "";

function table(headers, rows, limit = ROW_LIMIT) {
  if (!rows.length) return `<p class="muted">none</p>`;
  const head = `<tr>${headers.map((h) => `<th>${esc(h)}</th>`).join("")}</tr>`;
  const shown = rows.slice(0, limit).join("");
  const rest = rows.slice(limit);
  const more = rest.length ? `<details><summary>${rest.length} more</summary><table>${head}${rest.join("")}</table></details>` : "";
  return `<table>${head}${shown}</table>${more}`;
}

const lineRows = (lines) => lines.map((row) => `<tr>${when(row.at, row.approx)}<td class="lane">${esc(row.lane || "")}${row.to ? ` → ${esc(row.to)}` : ""}</td><td>${tag(row.verb)}</td><td class="text">${clip(row.text)}</td><td>${prs(row)}</td><td class="num">${inboxLink(row)}</td></tr>`);
const lineHeaders = ["when (PT)", "lane", "verb", "line", "PRs", "source"];

const sections = [
  ["lanes", "Lanes", (d) => [d.lanes.length, table(["last line (PT)", "lane", "idle", "verb", "last line", "tasks", "source"], d.lanes.map((lane) => {
    const last = lane.last || {};
    const idle = lane.idle_minutes == null ? "" : lane.idle_minutes >= 30 ? `<span class="warn">${lane.idle_minutes}m</span>` : `${lane.idle_minutes}m`;
    const tasks = lane.tasks.map((task) => `#${esc(task.id)} ${tag(task.status)} ${esc(task.subject)}`).join("<br>");
    return `<tr>${when(last.at, last.approx)}<td class="lane">${esc(lane.lane)}</td><td class="num">${idle}</td><td>${tag(last.verb)}</td><td class="text">${clip(last.text || "")}</td><td class="text">${tasks}</td><td class="num">${last.file ? inboxLink(last) : ""}</td></tr>`;
  }))]],
  ["incidents", "Incidents", (d) => [d.incidents.lines.length, table(lineHeaders, lineRows(d.incidents.lines), 30) + `<h3>incident folders</h3>` + table(["updated (PT)", "incident", "newest files"], d.incidents.folders.map((folder) => `<tr>${when(folder.updated_at)}<td title="${esc(folder.path)}">${esc(folder.slug)}</td><td class="text">${esc(folder.files.join(", "))}</td></tr>`), 15)]],
  ["asks", "Owner asks and tasks", (d) => {
    const manual = Object.entries(d.manual?.sections || {});
    const asks = d.ledger?.asks || [];
    const html = (manual.length ? manual.map(([name, items]) => `<h3>${esc(name)} (manual)</h3>` + table(["item", "link"], items.map((item) => `<tr><td class="text">${esc(item.text || Object.values(item)[0])}</td><td>${item.url ? link(item.url, item.url) : ""}</td></tr>`))).join("") : "")
      + `<h3>owner asks (ledger)</h3>` + table(["asked (PT)", "ask", "state", "lane", "text", "PRs"], asks.map((ask) => `<tr>${when(ask.asked_at)}<td>${esc(ask.key)}</td><td>${tag(ask.state)}</td><td>${esc(ask.lane)}</td><td class="text">${clip(ask.text)}</td><td>${(ask.prs || "").split(",").filter(Boolean).map(prLink).join(" ")}</td></tr>`), 25)
      + `<h3>open tasks</h3>` + table(["updated (PT)", "id", "status", "owner", "subject"], d.tasks.open.map((task) => `<tr>${when(task.updated_at)}<td class="num">#${esc(task.id)}</td><td>${tag(task.status)}</td><td>${esc(task.owner || "")}</td><td class="text" title="${esc(task.description || "")}">${esc(task.subject)}</td></tr>`))
      + `<details><summary>${d.tasks.completed.length} recently completed tasks</summary>` + table(["updated (PT)", "id", "owner", "subject"], d.tasks.completed.map((task) => `<tr>${when(task.updated_at)}<td class="num">#${esc(task.id)}</td><td>${esc(task.owner || "")}</td><td class="text">${esc(task.subject)}</td></tr>`), 100) + `</details>`
      + `<h3>rulings: GO, HOLD, LIFT, DECIDE, NOTE</h3>` + table(lineHeaders, lineRows(d.rulings), 30);
    return [asks.length + d.tasks.open.length, html];
  }],
  ["boards", "Boards", (d) => [d.boards.length, table(["status", "board", "session", "events"], d.boards.map((board) => `<tr><td>${tag(board.status)}</td><td class="text">${link(board.url, board.slug)}</td><td>${esc(board.session || "")}</td><td class="num">${esc(board.events)}</td></tr>`), 30)]],
  ["prs", "PRs and releases", (d) => {
    const ledger = d.ledger;
    const counts = ledger ? `<div class="stats">${Object.entries(ledger.counts).map(([k, v]) => `<div><b>${esc(v)}</b>${esc(k.replace("_", " "))}</div>`).join("")}${ledger.live_at ? `<div><b>${esc(pt(ledger.live_at))}</b>last live</div>` : ""}</div>` : "";
    const prRow = (row) => `<tr><td>${link(row.url, `#${row.pr}`)}</td><td>${esc(row.lane || "")}</td><td class="text">${esc(row.title || "")}</td><td>${tag(row.test_state)} ${tag(row.mergeable_state)}</td><td>${row.hold ? tag("held") + ` ${esc(row.hold)}` : ""}${row.queued ? tag("queued") : ""}${row.rules_blocked ? tag("rules-blocked") : ""}${row.waiting ? tag(row.waiting) : ""}</td><td class="num">${esc(row.head)}</td></tr>`;
    const html = counts
      + `<h3>release, landing, and PR lines</h3>` + table(lineHeaders, lineRows(d.releases), 40)
      + `<h3>open PRs in the ledger, newest first</h3>` + (ledger ? table(["PR", "lane", "title", "checks", "holds", "head"], ledger.open.map(prRow), 40) : "")
      + `<h3>last landed</h3>` + (ledger ? table(["landed (PT)", "PR", "lane", "title"], ledger.landed.map((row) => `<tr>${when(row.landed_at)}<td>${link(row.url, `#${row.pr}`)}</td><td>${esc(row.lane || "")}</td><td class="text">${esc(row.title || "")}</td></tr>`), 20) : "");
    return [ledger ? ledger.counts.open : d.releases.length, html];
  }],
  ["census", "Census", (d) => [d.census.length, table(lineHeaders, lineRows(d.census), 20)]],
  ["notes", "Plans and docs", (d) => {
    const n = d.notes;
    if (!n) return [0, `<p class="muted">cc-notes unavailable</p>`];
    const docRows = (docs) => docs.map((doc) => `<tr>${when(doc.updated_at)}<td>${ccn(doc.id)}</td><td>${tag(doc.status || "")}</td><td class="text">${esc(doc.title)}</td></tr>`);
    const headers = ["updated (PT)", "ccn id", "status", "title"];
    const html = `<h3>progress</h3>` + table(headers, docRows(n.progress))
      + `<h3>plans</h3>` + table(headers, docRows(n.plans), 15)
      + `<h3>handoffs</h3>` + table(headers, docRows(n.handoffs), 10)
      + `<h3>program docs</h3>` + table(headers, docRows(n.docs), 10)
      + `<h3>open investigations</h3>` + table(headers, docRows(n.investigations), 10)
      + `<h3>logs</h3>` + table(headers, docRows(n.logs), 10)
      + `<h3>answers</h3>` + table(headers, docRows(n.answers), 10);
    return [n.plans.length, html];
  }],
  ["compactions", "Compactions", (d) => {
    const c = d.compactions;
    const html = `<div class="stats"><div><b>${esc(c.count)}</b>compactions</div><div><b>${esc(pt(c.last_at))}</b>last, ${esc(ago(c.last_at))} ago</div></div>`
      + table(["when (PT)", "trigger", "tokens before", "tokens after"], c.recent.map((item) => `<tr>${when(item.at)}<td>${esc(item.trigger)}</td><td class="num">${esc(item.pre_tokens)}</td><td class="num">${esc(item.post_tokens)}</td></tr>`), 10);
    return [c.count, html];
  }],
  ["orca", "Orca and watches", (d) => {
    const o = d.orca;
    const orca = o ? `<div class="stats">${Object.entries(o.counts).map(([k, v]) => `<div><b>${esc(v)}</b>${esc(k)}</div>`).join("")}</div>`
      + `<h3>needs attention</h3>` + table(["dispatch", "lane", "categories", "activity"], o.attention.map((w) => `<tr><td class="num">${esc(w.dispatch)}</td><td>${esc(w.name || "")}</td><td>${w.categories.map(tag).join(" ")}</td><td>${esc(w.activity || "")}</td></tr>`))
      + `<h3>active tasks</h3>` + table(["created (PT)", "lane", "status"], o.active.map((t) => `<tr>${when(t.created_at)}<td>${esc(t.name)}</td><td>${tag(t.status)}</td></tr>`))
      + `<details><summary>recently finished</summary>` + table(["finished (PT)", "lane", "status"], o.recent.map((t) => `<tr>${when(t.completed_at)}<td>${esc(t.name)}</td><td>${tag(t.status)}</td></tr>`)) + `</details>` : `<p class="muted">no Orca run</p>`;
    const watches = `<h3>watch state files</h3>` + table(["updated (PT)", "file", "age", "pending"], d.watches.map((w) => `<tr>${when(w.updated_at)}<td title="${esc(w.path)}">${esc(w.name)}</td><td class="num ${w.age_seconds > 900 ? "warn" : ""}">${esc(Math.round(w.age_seconds / 60))}m</td><td class="num">${esc(w.pending ?? "")}</td></tr>`));
    return [o ? o.active.length : 0, orca + watches];
  }],
  ["feed", "Inbox feed", (d) => [d.feed.length, table(lineHeaders, lineRows(d.feed), 80)]],
];

function render() {
  const d = state.data;
  if (!d || !d.generated_at) {
    document.getElementById("meta").textContent = "collecting…";
    return;
  }
  const drive = d.drive;
  document.title = `${drive.program} · long-running`;
  document.getElementById("title").textContent = `${drive.program} (${drive.drive})`;
  document.getElementById("meta").innerHTML = `${esc(drive.repo)} · ledger ${esc((drive.ledger || "").slice(0, 8))}${drive.orca_run ? ` · ${esc(drive.orca_run)}` : ""} · updated ${esc(pt(d.generated_at))}`;
  document.getElementById("errors").textContent = Object.entries(d.errors).map(([k, v]) => `${k}: ${v}`).join(" · ");
  const open = new Set([...document.querySelectorAll("details[open]")].map((el) => el.closest("section")?.id + ":" + el.querySelector("summary")?.textContent));
  const built = sections.map(([id, label, build]) => {
    const [count, html] = build(d);
    return { id, label, count, html };
  });
  document.getElementById("nav").innerHTML = built.map((s) => `<a href="#${s.id}">${esc(s.label)} <span class="muted">${esc(s.count)}</span></a>`).join("");
  document.getElementById("main").innerHTML = built.map((s) => `<section id="${s.id}"><h2>${esc(s.label)} <span class="count">${esc(s.count)}</span></h2>${s.html}</section>`).join("");
  document.querySelectorAll("details").forEach((el) => {
    if (open.has(el.closest("section")?.id + ":" + el.querySelector("summary")?.textContent)) el.open = true;
  });
}

async function refresh() {
  try {
    const response = await fetch("/state.json", { cache: "no-store" });
    state.data = await response.json();
    render();
  } catch (error) {
    document.getElementById("errors").textContent = `dashboard unreachable: ${error}`;
  }
}

document.addEventListener("click", (event) => {
  const target = event.target.closest(".clip");
  if (target) target.classList.toggle("open");
});

refresh();
setInterval(refresh, REFRESH_MS);
</script>
</body>
</html>
