// @requires AI,AI_TOOLS,META,SLUG,aiCtxText,aiPrompt,aiReady,$,aiDiagRender,aiTally,aiUsage

const AI_RATE_KEY="design-doc-ai-rate";

function aiWait(ms,signal){

  const stop=()=>reject(new DOMException("aborted","AbortError"));

function aiRecent(){

async function aiSlot(signal){

}
function aiRetryAfter(header){

async function aiStream(body,signal,onText,onReason){

function fuzzy(q,text){
 const t=text.toLowerCase();
 let score=0;
 for(const w of q){
  const at=t.indexOf(w);
  if(at<0){
   let j=0,gaps=0;
   for(const ch of w){const k=t.indexOf(ch,j);if(k<0)return 0;gaps+=k-j;j=k+1}
   score+=Math.max(1,8-gaps);
   continue;
  }
  score+=20+(at===0||/\W/.test(t[at-1])?15:0)+Math.max(0,10-at/8);
 }
 return score;
}

 const items=Object.keys(CAPS).filter(g=>groups[g]).sort((a,b)=>groups[b][0].score-groups[a][0].score).flatMap(g=>groups[g].slice(0,q.length?CAPS[g]:20));
 if(q.length&&AI.key&&!QUESTION.test(raw.trim()))items.push({group:"Assistant",icon:"✦",label:`Show only what matches: ${raw.trim()}`,sub:"the assistant picks the pull requests and dims the rest",go:()=>filterBy(raw.trim()),ask:true});
 if(q.length&&AI.key){const askRow={group:"Assistant",icon:"✦",label:`Ask: ${raw.trim()}`,sub:"answers from the drive's records, the plan and your words",go:()=>askInPal(raw.trim()),ask:true};QUESTION.test(raw.trim())?items.unshift(askRow):items.push(askRow)}
 return {items,q};
}
function openPal(){history.replaceState({...history.state,y:scrollY},"");location.hash="#/jump"}
function showPal(){
 PAL.hidden=false;
 const input=document.getElementById("pal-q");
 input.value="";input.focus();
 document.getElementById("pal-ans").hidden=true;
 paintPal();
}
function closePal(){PAL.hidden=true;pal.busy=null}
function leavePal(){if(pal.from)history.back();else location.hash="#/"}
window.addEventListener("hashchange",e=>{pal.from=location.hash==="#/jump"?new URL(e.oldURL).hash:null})
function paintPal(){
 const {items,q}=results(document.getElementById("pal-q").value);
 pal.items=items;pal.i=Math.min(pal.i,Math.max(0,items.length-1));
 let last=null;
 document.getElementById("pal-list").innerHTML=items.map((e,i)=>{const h=e.group!==last?`<div class="gh">${esc(e.group)}</div>`:"";last=e.group;return `${h}<div class="it${i===pal.i?" on":""}" data-i="${i}"><span class="ic${e.ask?" ai":""}">${e.icon}</span><div style="min-width:0"><div class="l">${mark(e.label,q)}</div>${e.sub?`<div class="s">${esc(e.sub)}</div>`:""}</div><span class="h">${i===pal.i?"↵":""}</span></div>`}).join("")||'<div class="gh">No matches. Press tab to ask the assistant.</div>';
 document.querySelector("#pal-list .it.on")?.scrollIntoView({block:"nearest"});
}
function pick(i){const e=pal.items[i];if(!e)return;if(!e.ask)closePal();e.go()}
async function askInPal(question){
 const box=document.getElementById("pal-ans");
 box.hidden=false;box.innerHTML='<span class="dim">✦ Reading the drive…</span>';
 const mine=pal.busy={};
 try{
  const text=await assistAsk(question,[],t=>{if(pal.busy===mine)box.innerHTML=markdown(t)});
  if(pal.busy===mine)box.innerHTML=markdown(text)+`<div class="dim" style="margin-top:8px"><a href="#/ask" data-carry="${esc(question)}">Continue in Ask ›</a></div>`;
 }catch(e){if(pal.busy===mine)box.innerHTML=`<span class="dim">The assistant could not answer: ${esc(e.message)}</span>`}
}

function openSheet(s){sheet=s;paintSheet()}
function paintSheet(){
 const box=document.getElementById("ash");
 if(!sheet){box.hidden=true;return}
 const m=state.model;
 let html="";
 if(sheet.kind==="stack"){
  const rows=m.board.rows.filter(r=>r.group===sheet.id);
  html=`<div class="kick">Change group</div><h2>${esc(sheet.id)}</h2><p class="dim">${esc(rows[0]?.group_summary??"")}</p>${aiBox(stackKey(sheet.id),"The stack in plain words")}${rows.map(r=>`<div class="rec"><a class="d ${prState(r.number)}" href="${prHref(r.number)}"></a> ${prLink(r.number)} ${esc(r.title)}<span class="dim">${STATE_WORD[prState(r.number)]} · ${esc(short(r.change,120))}</span></div>`).join("")}`;
  if(!ai[stackKey(sheet.id)])summarizeStack(sheet.id);
 }else if(sheet.kind==="lane"){
  const l=m.lanes.find(x=>x.lane===sheet.id);
  const recs=m.records.filter(r=>r.lane===sheet.id).slice(-8).reverse();
  const holds=Object.keys(m.prs).filter(n=>m.prs[n].lane===sheet.id&&m.prs[n].state==="open");
  const key=`lane:${sheet.id}:${recs[0]?.seq??l?.at}`;
  html=`<div class="kick">Worker</div><h2>${esc(sheet.id)}</h2><p class="dim">last wrote ${l?agoWords(l.at):"not in the last day"}${holds.length?` · holds ${holds.map(n=>prLink(n)).join(" ")}`:""}</p>${aiBox(key,"What it is doing")}${recs.map(r=>`<div class="rec">${inline(short(r.text,300))}<span class="dim">${clock(r.at)} · ${KIND_WORD[r.kind]??r.kind}</span></div>`).join("")}`;
  if(!ai[key])queueMicrotask(()=>stream(key,`In two plain sentences, say what the worker ${sheet.id} is doing right now and whether it looks stuck, from its latest status line and records. Latest status (${l?clock(l.at):"none"}): ${l?.text??"none"}\nRecords, newest first:\n${recs.map(r=>`${clock(r.at)} ${r.kind}: ${short(r.text,300)}`).join("\n")}`));
 }else if(sheet.kind==="word"){
  const w=words().find(x=>x.id===sheet.id);
  if(!w){sheet=null;return paintSheet()}
  html=`<div class="kick">Your words · ${esc(w.id)}</div><h2>${esc(w.title)}</h2><p class="dim">${clock(w.at)}</p><blockquote>${esc(w.text)}</blockquote>`;
 }else{
  const r=m.records.find(x=>x.seq===sheet.id);
  if(!r){sheet=null;return paintSheet()}
  html=`<div class="kick">${esc(KIND_WORD[r.kind]??r.kind)} · #${r.seq}</div><h2>${esc(r.lane)}</h2><p class="dim">${clock(r.at)}</p><div class="prose">${markdown(r.text)}</div>`;
 }
 box.innerHTML=`<button class="btn x" data-unsheet>Close</button>${html}`;
 box.hidden=false;
 box.querySelectorAll("[data-ai]").forEach(b=>paintAi(b.dataset.ai));
}

document.addEventListener("keydown",e=>{
 const palOpen=!PAL.hidden;
 if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault();palOpen?leavePal():openPal();return}
 if(!palOpen&&e.key==="/"&&!e.target.closest("input,textarea")){e.preventDefault();openPal();return}
 if(!palOpen){if(e.key==="Escape"&&sheet){sheet=null;paintSheet()}return}
 e.stopImmediatePropagation();
 if(e.key==="Escape"){e.preventDefault();leavePal()}
 else if(e.key==="ArrowDown"){e.preventDefault();pal.i=Math.min(pal.items.length-1,pal.i+1);paintPal()}
 else if(e.key==="ArrowUp"){e.preventDefault();pal.i=Math.max(0,pal.i-1);paintPal()}
 else if(e.key==="Enter"){e.preventDefault();pick(pal.i)}
 else if(e.key==="Tab"&&AI.key){e.preventDefault();const q=document.getElementById("pal-q").value.trim();if(q)askInPal(q)}
},true);
document.getElementById("pal-q").addEventListener("input",()=>{pal.i=0;document.getElementById("pal-ans").hidden=true;paintPal()});
document.getElementById("pal-list").addEventListener("click",e=>{const it=e.target.closest("[data-i]");if(it)pick(Number(it.dataset.i))});
PAL.addEventListener("click",e=>{const c=e.target.closest("[data-carry]");if(c){closePal();setTimeout(()=>ask(c.dataset.carry),0)}else if(e.target.id==="pal"||e.target.closest("[data-pal-close]"))leavePal()});
document.addEventListener("click",e=>{
 const t=e.target;
 if(t.closest("[data-unsheet]")){sheet=null;paintSheet();return}
 const sp=t.closest("[data-sum-pr]");if(sp){summarizePr(sp.dataset.sumPr);return}
 const ss=t.closest("[data-sum-stack]");if(ss){openSheet({kind:"stack",id:ss.dataset.sumStack});return}
 const want=(n,head)=>{const r=boardRow(n);return {block:r.block,number:r.number,head}};
 const tap=t.closest("[data-tap]");if(tap&&!batching){post(want(tap.dataset.n,tap.dataset.head),tap.dataset.tap);return}
 const batch=t.closest("[data-batch]");if(batch&&!batching){approveAll(batch.dataset.batch.split(",").map(want));return}
 if(sheet&&!t.closest("#ash")&&!t.closest("#pal")&&t.closest("a[href^='#']")){sheet=null;paintSheet()}
});
Object.assign(window,{assistAsk,needsYou,needsCount,decorate,plainWord});
})();
</script>
