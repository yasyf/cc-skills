   try{const args=JSON.parse(c.args);onTool(c.name,args);out=await tool(c.name,args)}
   catch(e){out="that tool failed: "+e.message}
   const room=Math.min(AI_RESULT_CAP,AI_TOOL_BUDGET-spent);
   if(room<=0)out="the tool budget for this question is spent; answer from what you already have";
   else if(out.length>room)out=out.slice(0,room)+"\n[truncated]";
   spent+=out.length;
   msgs.push({role:"tool",tool_call_id:c.id,content:out});
  }
 }
 return "";
}
async function submit(question){
 if(!question.trim()||view.busy)return;
 view.busy=new AbortController();
 $("#send").disabled=true;
 bubble("user",esc(question));
 const node=bubble("assistant","<p class=\"tools\">Reading the drive…</p>");
 const used=[];
 const paint=text=>{node.innerHTML=mdToHtml(text)+(used.length?`<div class="tools">${esc(used.join(" · "))}</div>`:"")};
 try{
  const text=await answer(question,paint,(name,args)=>{used.push(`${name} ${Object.values(args).join(" ")}`.trim());paint("")});
  paint(text);
  view.history.push({role:"user",content:question},{role:"assistant",content:text});
  sessionStorage.setItem(SLUG+":history",JSON.stringify(view.history.slice(-HISTORY_TURNS*2)));
 }catch(e){
  node.classList.add("error");
  node.textContent=e.message;
 }finally{
  view.busy=null;
  $("#send").disabled=false;
 }
}
async function boot(){
 const state=await (await fetch("/state.json",{cache:"no-store"})).json();
 view.repo=state.drive?.repo||"";
 view.drive=state.drive?.drive||"";
 SLUG=`lr-dashboard:${view.drive}`;
 aiCtxText=SYSTEM;
 document.title=`ask · ${state.drive?.program||"long-running"}`;
 $("#meta").textContent=`${state.drive?.program||""} (${view.drive})`;
 view.history=JSON.parse(sessionStorage.getItem(SLUG+":history")||"[]");
 view.history.forEach(m=>bubble(m.role,m.role==="user"?esc(m.content):mdToHtml(m.content)));
 $("#suggest").innerHTML=SUGGESTIONS.map(s=>`<button type="button">${esc(s)}</button>`).join("");
}
$("#suggest").addEventListener("click",e=>{const b=e.target.closest("button");if(b)submit(b.textContent)});
$("#ask").addEventListener("submit",e=>{e.preventDefault();const q=$("#question").value;$("#question").value="";submit(q)});
$("#question").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("#ask").requestSubmit()}});
boot();
</script>
