<header>

  <span class="errors" id="errors"></span>
  <nav id="nav"></nav>
</header>
<main id="main"></main>
<script>
const REFRESH_MS=10000;

function cellHtml(column,row){

 if(column.cite)return `<td>${value?citeChip(value):""}</td>`;

function renderTimeline(view){

function sparkline(values){

function renderStat(view){
 const d=view.data;
 if(d.value==null)return `<p class="muted">no value</p>`;
 const delta=d.delta==null?"":`<span class="delta ${d.delta>0?"ok":d.delta<0?"bad":"muted"}">${d.delta>0?"+":""}${esc(d.delta)}</span>`;

const PALETTE=["#0a66c2","#c4211c","#1a7f37","#b25000","#7d3fc9","#0b8a8a"];
function renderSeries(view){
 const series=view.data.series||[];
 const all=series.flatMap(s=>s.points);
 if(!all.length)return `<p class="muted">no points</p>`;

}
function renderMatrix(view){
 const d=view.data;
 if(!d.rows.length)return `<p class="muted">none</p>`;
 const head=`<tr><th></th>${d.cols.map(c=>`<th class="col">${esc(c)}</th>`).join("")}</tr>`;

  const cell=(d.cells[r]||{})[c];
  if(!cell)return `<td class="cell none"></td>`;
  const inner=`<td class="cell ${tone(cell.value)||"none"}" title="${esc((cell.title||cell.value||"")+"")}">${cell.url&&safeUrl(cell.url)?`<a href="${esc(cell.url)}" target="_blank" rel="noopener">·</a>`:""}</td>`;

function renderProgress(view){
 const d=view.data,pct=d.total?Math.round(d.done/d.total*100):0;

function renderKv(view){

}
function cardHtml(view){

function render(){
 const d=state.data;
 if(!d||!d.generated_at){$("#meta").textContent="collecting…";return}
 const drive=d.drive;
 document.title=`${drive.program} · long-running`;
 $("#title").textContent=`${drive.program} (${drive.drive})`;
 $("#meta").textContent=`${drive.repo} · updated ${pt(d.generated_at)}`;
 $("#errors").textContent=Object.entries(d.errors).map(([k,v])=>`${k}: ${v}`).join(" · ");

 d.views.forEach(v=>{let s=sections.find(x=>x.name===(v.section||"Views"));if(!s){s={name:v.section||"Views",views:[]};sections.push(s)}s.views.push(v)});

 const live=new Set(sections.map(s=>slug(s.name)));
 [...main.children].forEach(node=>{if(!live.has(node.id)){node.querySelectorAll(".card").forEach(card=>delete state.painted[card.dataset.view]);node.remove()}});
 sections.forEach((s,i)=>{
  let node=document.getElementById(slug(s.name));
  if(!node){node=el("section","section",`<h2>${esc(s.name)}</h2><div class="grid"></div>`);node.id=slug(s.name)}
  place(main,node,i);
  const grid=node.querySelector(".grid");
  const ids=new Set(s.views.map(v=>"v-"+v.id));
  [...grid.children].forEach(card=>{if(!ids.has(card.id)){delete state.painted[card.dataset.view];card.remove()}});
  s.views.forEach((v,j)=>{
   let card=document.getElementById("v-"+v.id);
   if(!card){card=el("div","card"+(SMALL.has(v.type)?" small":""));card.id="v-"+v.id;card.dataset.view=v.id}
   place(grid,card,j);

function place(parent,node,index){if(parent.children[index]!==node)parent.insertBefore(node,parent.children[index]||null)}

document.addEventListener("input",e=>{

});
async function refresh(){

  const r=await fetch("/state.json",{cache:"no-store"});
  state.data=await r.json();
  render();

refresh();
setInterval(refresh,REFRESH_MS);
</script>
