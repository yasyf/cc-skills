 .lane-grid { grid-template-columns:1fr; } .search { display:none; }
 .detail-grid { grid-template-columns:100px minmax(0,1fr); }
}
</style>
</head>
<body>
<header class="top"><div class="top-inner">
 <div class="brand"><h1 id="title">long-running</h1><span class="eyebrow">drive</span></div>
 <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><input id="search" type="search" aria-label="Search the dashboard" placeholder="Search releases, stacks, lanes, PRs…"></label>
 <div class="status" id="status"><span class="dot"></span><span id="meta">Connecting…</span></div>
</div></header>
<main>
 <div class="errors" id="errors" role="status"></div>
 <section class="tiles" id="tiles" aria-label="Key numbers"></section>
 <section class="charts" id="charts" aria-label="Trends"></section>
 <section class="card now" aria-labelledby="now-title">
  <div class="now-head"><span class="pulse" aria-hidden="true"></span><h2 id="now-title">Happening now</h2><div class="chips" id="now-chips"></div><button class="link-button" id="now-more" type="button" style="margin-left:auto"></button></div>
  <ol class="now-list" id="now-list"></ol>
 </section>
 <section aria-labelledby="tasks-title">
  <div class="section-head"><h2 id="tasks-title">For you<span class="count" id="task-count"></span></h2><button class="link-button" id="tasks-more" type="button"></button></div>
  <div class="tasks-list" id="tasks"></div>
  <div class="card replies" id="replies" hidden></div>
 </section>
 <div class="groups" id="groups"></div>
</main>
<dialog id="detail" aria-labelledby="detail-title"><div class="dialog-head"><h2 id="detail-title"></h2><button id="detail-close" type="button" aria-label="Close">×</button></div><div id="detail-body"></div></dialog>
<div class="tip" id="tip" role="tooltip"></div>
<script>
const REFRESH_MS=10000;
const BUILDS_STALE_MS=180000;
const PACIFIC="America/Los_Angeles";
const ACTION_TOKEN=document.querySelector('meta[name="dashboard-action"]').content;
const BAD=/\b(fail|failed|failing|failure|red|lost|blocked|error|broken|conflicting|drift|not submitted)\b/i;
const WARN=/\b(unplanned|unproven|held|hold|pending|warn|stale|new|running|in_progress|queued|waiting|investigating|mechanism found|scheduled|creating|canceling)\b/i;
const OK=/\b(landed|live|clean|passed|completed|answered|proven|0\/0|submitted|converged|fix live|recovered|resolved)\b/i;
// @requires 
// @defines $,URL_ATTR,el,esc,fmt,railLink,reduced,safeUrl,scrub
const $=s=>document.querySelector(s);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const fmt=ms=> ms>=1000?(ms/1000).toFixed(ms>=10000?0:1)+"s" : ms>=1?(ms%1?ms.toFixed(1):ms)+"ms" : (ms*1000)+"µs";
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const railLink=id=>document.querySelector(`#rail a[href="#${id}"]`);
const safeUrl=u=>{const m=/^([a-z][a-z0-9+.\-]*):/i.exec(String(u).replace(/[\s\u0000-\u001f]/g,""));return !m||/^https?$/i.test(m[1])};
const URL_ATTR=/^(href|src|xlink:href)$/i;
const reduced=()=>matchMedia("(prefers-reduced-motion: reduce)").matches;
function scrub(root){
 root.querySelectorAll("*").forEach(n=>{
  [...n.attributes].forEach(a=>{
   if(/^on/i.test(a.name))n.removeAttribute(a.name);
   else if(URL_ATTR.test(a.name)&&!safeUrl(a.value))n.removeAttribute(a.name);
  });
 });
}
const state={data:null,query:"",painted:{},expanded:{},releaseFilter:"all",stackFilter:"all",nowFilter:"all",nowOpen:false,tasksAll:false,sent:{},sort:{},filters:{},returnFocus:null};
const COLORS={passed:"var(--ok)",failed:"var(--bad)",canceled:"var(--idle)",cancelled:"var(--idle)",running:"var(--info)"};

const sameDay=(a,b)=>a.toLocaleDateString("en-US",{timeZone:PACIFIC})===b.toLocaleDateString("en-US",{timeZone:PACIFIC});
function pt(stamp){
 if(!stamp)return "";
 const d=new Date(stamp);
 const time=d.toLocaleTimeString("en-US",{timeZone:PACIFIC,hour:"numeric",minute:"2-digit"});
 return sameDay(d,new Date())?time:d.toLocaleDateString("en-US",{timeZone:PACIFIC,month:"short",day:"numeric"})+", "+time;
}
const hourLabel=stamp=>new Date(stamp).toLocaleTimeString("en-US",{timeZone:PACIFIC,hour:"numeric"});
const span=stamp=>{const h=Math.round((Date.now()-Date.parse(stamp))/3600000);return h<1?"the last hour":h<48?h+"h":Math.round(h/24)+" days"};
const LINK_NAMES=[[/slack\.com/,"Slack"],[/datadoghq/,"Datadog"],[/buildkite\.com/,"Buildkite"],[/github\.com/,"GitHub"]];
function linkify(text){
 return esc(text).replace(/https?:\/\/[^\s<>"]+/g,match=>{
  const [,u,tail]=/^(.*?)((?:&quot;|&#39;|[.,;:)\]])*)$/.exec(match);
  const name=(LINK_NAMES.find(([re])=>re.test(u))||[,"link"])[1];
  return safeUrl(u.replace(/&amp;/g,"&"))?`<a href="${u}" target="_blank" rel="noopener">${name} ↗</a>${tail}`:match;
 });
}
function ago(stamp){
 if(!stamp)return "";
 const minutes=Math.round((Date.now()-new Date(stamp).getTime())/60000);
 if(minutes<1)return "just now";
 if(minutes<60)return minutes+"m ago";
 if(minutes<2880)return Math.round(minutes/60)+"h ago";
 return Math.round(minutes/1440)+"d ago";
}
function dur(minutes){
 if(minutes==null)return "";
 if(minutes<1)return Math.round(minutes*60)+"s";
 if(minutes<60)return (minutes<10?minutes.toFixed(1):Math.round(minutes))+"m";
 return Math.floor(minutes/60)+"h "+Math.round(minutes%60)+"m";
}
function elapsed(stamp){
 const s=Math.max(0,Math.floor((Date.now()-new Date(stamp).getTime())/1000));
 if(s<60)return s+"s";
 if(s<3600)return Math.floor(s/60)+"m "+String(s%60).padStart(2,"0")+"s";
 return Math.floor(s/3600)+"h "+String(Math.floor(s%3600/60)).padStart(2,"0")+"m";
}
const tone=value=>{const text=String(value??"");return BAD.test(text)?"bad":WARN.test(text)?"warn":OK.test(text)?"ok":""};
const pill=(value,cls)=>value==null||value===""?"":`<span class="pill ${cls??tone(value)}">${esc(value)}</span>`;
const ext=(href,label,cls="")=>href&&safeUrl(href)?`<a class="${cls}" href="${esc(href)}" target="_blank" rel="noopener">${esc(label)}</a>`:"";
const clip=value=>`<div class="clip">${esc(value??"")}</div>`;
const plural=(n,word)=>`${n} ${word}${n===1?"":"s"}`;
const matches=text=>state.query.toLowerCase().split(/\s+/).filter(Boolean).every(term=>String(text).toLowerCase().includes(term));
const viewById=id=>(state.data?.views||[]).find(v=>v.id===id);
const rowsOf=id=>viewById(id)?.data?.rows||[];
function paint(node,key,html){
 if(state.painted[key]===html)return;
 const open=new Set([...node.querySelectorAll(".clip.open")].map(n=>n.textContent));
 state.painted[key]=html;node.innerHTML=html;
 node.querySelectorAll(".clip").forEach(n=>{if(open.has(n.textContent))n.classList.add("open")});
}

const KIND_LABEL={release:"Release",hotfix:"Hotfix",rollback:"Rollback",deploy:"Deploy",plan:"Plan",check:"Check","dry-run":"Dry run"};
const STATE_LABEL={passed:"Passed",failed:"Failed",canceled:"Canceled",cancelled:"Canceled",running:"Running",scheduled:"Queued",creating:"Starting",blocked:"Waiting",canceling:"Canceling",failing:"Failing",skipped:"Skipped",not_run:"Not run"};
const releaseState=row=>pill(STATE_LABEL[row.state]||row.state,{passed:"ok",failed:"bad",failing:"bad",canceled:"",cancelled:""}[row.state]??"info");
const release=number=>(state.data.releases||[]).find(r=>r.number===number);

function tile(label,body,drill,foot){
 return `<div class="card tile"><button class="tile-main" type="button" data-drill="${esc(drill)}"><span class="tile-label">${esc(label)}</span>${body}</button>${foot||""}</div>`;
}
function ring(value,total){
 const r=19,c=2*Math.PI*r,pct=total?value/total:0;
 return `<svg class="ring" viewBox="0 0 46 46" aria-hidden="true"><circle cx="23" cy="23" r="${r}" stroke="var(--idle-soft)"/><circle cx="23" cy="23" r="${r}" stroke="var(--ok)" stroke-linecap="round" stroke-dasharray="${(pct*c).toFixed(1)} ${c.toFixed(1)}"/></svg>`;
}
const foot=(attr,html)=>`<button class="tile-foot" type="button" ${attr}>${html}</button>`;
function renderTiles(){
 const d=state.data,o=d.overview,t=o.tiles,last=o.last_release,c=o.charts;
 const stacks=t.stacks,before=c.census.length>1?c.census[0]:null;
 const delta=stacks&&before?stacks.at_zero-before.n:0;
 const stackFoot=foot(`data-drill="stacks:blocked"`,`${rowsOf("platy-stacks").filter(r=>r.deployable==="blocked").length} blocked${delta?` · <span class="${delta>0?"ok":"bad"}-text">${delta>0?"+":""}${delta}</span> in ${esc(span(before.at))}`:""}`);
 const stackTile=stacks?tile("Stacks at 0/0",`<span class="tile-row">${ring(stacks.at_zero,stacks.total)}<span><span class="tile-value">${stacks.at_zero}<small>/${stacks.total}</small></span><div class="tile-sub">${Math.round(stacks.at_zero/stacks.total*100)}% · ${stacks.total-stacks.at_zero} to go</div></span></span>`,"stacks",stackFoot):tile("Stacks at 0/0",`<span class="tile-value muted">—</span><span class="tile-sub">Census unavailable</span>`,"stacks");
 const r=t.releases_today,total=r.passed+r.failed+r.canceled+r.running;
 const split=total?`<div class="split">${[["passed","var(--ok)"],["failed","var(--bad)"],["canceled","var(--idle)"],["running","var(--info)"]].map(([k,c])=>r[k]?`<i style="width:${r[k]/total*100}%;background:${c}"></i>`:"").join("")}</div>`:"";
 const lastFoot=last?`<button class="tile-foot" type="button" data-release="${last.number}">Last: #${last.number} <span class="${tone(last.state)}-text">${esc((STATE_LABEL[last.state]||last.state).toLowerCase())}</span> · ${esc(ago(last.finished_at||last.at))}</button>`:"";
 const releaseTile=tile("Releases today",`<span class="tile-value">${total}</span>${split}<span class="tile-sub"><span class="ok-text">${r.passed} passed</span> · <span class="${r.failed?"bad-text":""}">${r.failed} failed</span>${r.running?` · <span class="info-text">${r.running} live</span>`:""}</span>`,"releases:today",lastFoot);
 const slowest=c.durations.filter(x=>x.state==="passed").sort((a,b)=>b.minutes-a.minutes)[0];
 const median=tile("Median release",`<span class="tile-value">${t.median_minutes==null?"—":dur(t.median_minutes)}</span><span class="tile-sub">${t.median_of?`over the last ${plural(t.median_of,"passed release")}`:"No finished releases yet"}</span>`,"releases:applying",slowest?foot(`data-release="${slowest.number}"`,`Slowest: #${slowest.number} · ${dur(slowest.minutes)}`):"");
 const newest=c.landed.flatMap(h=>h.prs).sort((a,b)=>b.at.localeCompare(a.at))[0];
 const prs=tile("PRs landed today",`<span class="tile-value">${t.prs.landed_today}</span><span class="tile-sub">${t.prs.open} open in the ledger</span>`,"landed",newest?foot(`data-drill="landed"`,`Last: #${newest.pr} · ${esc(ago(newest.at))}`):"");
 const openInc=(d.incidents||[]).find(g=>g.active);
 const inc=tile("Open incidents",`<span class="tile-value ${t.incidents?"bad-text":"ok-text"}">${t.incidents}</span><span class="tile-sub">${t.incidents?`${t.sightings} without a lane yet`:"Nothing open"}</span>`,"incidents",openInc?foot(`data-incident="${esc(openInc.key)}"`,`${esc(openInc.sighting?"Alert":openInc.title)} · ${esc(ago(openInc.at))}`):"");
 const lane=(d.lanes||[]).find(l=>l.lane!=="owner");
 const lanes=tile("Lanes working",`<span class="tile-value">${t.lanes}</span><span class="tile-sub">posted in the last 30 minutes</span>`,"lanes",lane?foot(`data-lane="${esc(lane.lane)}"`,`${esc(lane.lane)} · ${esc(ago(lane.at))}`):"");
 paint($("#tiles"),"tiles",stackTile+releaseTile+median+prs+inc+lanes);
}

function bars(points,{height=120,max,color,label,attrs}){
 if(!points.length)return `<p class="empty">No data yet</p>`;
 max=max??Math.max(...points.map(p=>p.value),1);
 const w=100/points.length,gap=Math.min(w*.25,1.2);
 const rects=points.map((p,i)=>{const h=Math.max(p.value/max*(height-14),p.value?2:0);return `<rect class="hit" x="${(i*w+gap/2).toFixed(2)}" y="${(height-h).toFixed(2)}" width="${(w-gap).toFixed(2)}" height="${h.toFixed(2)}" rx="1" fill="${color(p)}" data-tip="${esc(label(p))}" ${attrs(p,i)}></rect>`}).join("");
 return `<svg viewBox="0 0 100 ${height}" preserveAspectRatio="none" role="img">${rects}<line x1="0" x2="100" y1="${height}" y2="${height}" stroke="var(--line)" vector-effect="non-scaling-stroke"/></svg>`;
}
function niceMax(v){const p=10**Math.floor(Math.log10(v||1));return Math.ceil(v/p)*p}
function renderCharts(){
 const c=state.data.overview.charts;
 const durations=c.durations;
 const dmax=niceMax(Math.max(...durations.map(d=>d.minutes),1));
 const durationChart=`<div class="card chart"><div class="chart-head"><h3>Release durations</h3><span>last ${durations.length}</span></div><div class="plot"><span class="ymax">${dur(dmax)}</span>${bars(durations.map(d=>({...d,value:d.minutes})),{max:dmax,color:p=>COLORS[p.state]||"var(--idle)",label:p=>`#${p.number} ${p.title} · ${(STATE_LABEL[p.state]||p.state).toLowerCase()} · ${dur(p.minutes)} · ${pt(p.at)}`,attrs:p=>`data-release="${p.number}"`})}</div><div class="axis"><span>${durations.length?esc(pt(durations[0].at)):""}</span><span>${durations.length?esc(pt(durations[durations.length-1].at)):""}</span></div><div class="legend">${[["passed","Passed"],["failed","Failed"],["canceled","Canceled"]].map(([k,l])=>`<span><i style="background:${COLORS[k]}"></i>${l}</span>`).join("")}</div></div>`;
 const census=c.census;
 let censusPlot=`<p class="empty">No census yet</p>`;
 if(census.length){
  const total=Math.max(...census.map(p=>p.total)),lo=Math.max(0,Math.min(...census.map(p=>p.n))-10),H=120;
  const xs=census.map(p=>Date.parse(p.at)),x0=Math.min(...xs),x1=Math.max(...xs);
  const X=x=>x1===x0?50:(x-x0)/(x1-x0)*100,Y=v=>H-(v-lo)/((total-lo)||1)*(H-8);
  const line=census.map((p,i)=>`${X(xs[i]).toFixed(2)},${Y(p.n).toFixed(2)}`).join(" ");
  const dots=census.map((p,i)=>`<rect class="hit" x="${(X(xs[i])-1.4).toFixed(2)}" y="0" width="2.8" height="${H}" fill="transparent" data-tip="${esc(`${p.n} of ${p.total} at 0/0 · ${pt(p.at)}`)}" data-drill="stacks"></rect>`).join("");
  censusPlot=`<svg viewBox="0 0 100 ${H}" preserveAspectRatio="none" role="img"><line x1="0" x2="100" y1="${Y(total)}" y2="${Y(total)}" stroke="var(--faint)" stroke-dasharray="2 2" vector-effect="non-scaling-stroke"/><polygon points="0,${H} ${line} 100,${H}" fill="var(--ok-soft)"/><polyline points="${line}" fill="none" stroke="var(--ok)" stroke-width="2" vector-effect="non-scaling-stroke"/>${dots}</svg>`;
 }
 const last=census[census.length-1];
 const censusChart=`<div class="card chart"><div class="chart-head"><h3>Stacks at 0/0</h3><span>${last?`${last.n} of ${last.total} now`:""}</span></div><div class="plot">${censusPlot}</div><div class="axis"><span>${census.length?esc(pt(census[0].at)):""}</span><span>${last?"now":""}</span></div></div>`;
 const hours=c.landed;
 const landedTotal=hours.reduce((s,h)=>s+h.count,0);
 const landedChart=`<div class="card chart"><div class="chart-head"><h3>PRs landed per hour</h3><span>${landedTotal} in 24h</span></div><div class="plot"><span class="ymax">${Math.max(...hours.map(h=>h.count),0)}</span>${bars(hours.map(h=>({...h,value:h.count})),{color:()=>"var(--info)",label:h=>`${hourLabel(h.hour)} · ${plural(h.count,"PR")} landed`,attrs:(h,i)=>`data-hour="${i}"`})}</div><div class="axis"><span>${hours.length?esc(hourLabel(hours[0].hour)):""}</span><span>${hours.length?esc(hourLabel(hours[hours.length-1].hour)):""}</span></div></div>`;
 const states=c.states,sum=states.reduce((s,x)=>s+x.count,0);
 const SC={"0/0":"var(--ok)",drift:"var(--bad)",unplanned:"var(--warn)"},SL={"0/0":"At 0/0",drift:"Drift",unplanned:"Not planned"};
 let offset=0;const R=15.9155;
 const arcs=states.filter(s=>s.count).map(s=>{const len=s.count/sum*100;const a=`<circle class="hit" cx="21" cy="21" r="${R}" fill="none" stroke="${SC[s.state]}" stroke-width="6" stroke-dasharray="${len.toFixed(2)} ${(100-len).toFixed(2)}" stroke-dashoffset="${(25-offset).toFixed(2)}" data-tip="${esc(`${SL[s.state]}: ${s.count} stacks`)}" data-zero="${esc(s.state)}"></circle>`;offset+=len;return a}).join("");
 const at=states.find(s=>s.state==="0/0")?.count||0;
 const donut=sum?`<div class="donut-wrap"><svg class="donut" viewBox="0 0 42 42" role="img"><circle cx="21" cy="21" r="${R}" fill="none" stroke="var(--idle-soft)" stroke-width="6"></circle>${arcs}<text x="21" y="21" text-anchor="middle" font-size="7" font-weight="650" fill="currentColor">${Math.round(at/sum*100)}%</text><text x="21" y="27" text-anchor="middle" font-size="3.4" fill="var(--muted)">at 0/0</text></svg><div class="donut-legend">${states.map(s=>`<button type="button" data-zero="${esc(s.state)}"><i style="background:${SC[s.state]}"></i><span>${SL[s.state]}</span><b>${s.count}</b></button>`).join("")}</div></div>`:`<p class="empty">No census report</p>`;
 const donutChart=`<div class="card chart"><div class="chart-head"><h3>Census by state</h3><span>${sum} stacks</span></div>${donut}</div>`;
 paint($("#charts"),"charts",durationChart+censusChart+landedChart+donutChart);
}

const NOW_KINDS=[["release","Releases"],["incident","Incidents"],["lane","Lanes"],["hold","Holds"]];
const NOW_TONE={release:"info",incident:"bad",lane:"",hold:"warn"};
function renderNow(){
 const items=state.data.overview.live.filter(i=>matches(`${i.title} ${i.detail}`));
 const counts=Object.fromEntries(NOW_KINDS.map(([k])=>[k,items.filter(i=>i.kind===k).length]));
 paint($("#now-chips"),"now-chips",[["all",`All ${items.length}`],...NOW_KINDS.map(([k,l])=>[k,`${l} ${counts[k]}`])].map(([k,l])=>`<button class="chip" type="button" data-now="${k}" aria-pressed="${state.nowFilter===k}">${esc(l)}</button>`).join(""));
 const shown=items.filter(i=>state.nowFilter==="all"||i.kind===state.nowFilter);
 const list=$("#now-list");
 list.classList.toggle("open",state.nowOpen);
 $("#now-more").textContent=shown.length>6?(state.nowOpen?"Show less":`Show all ${shown.length}`):"";
 const keep=new Set();
 shown.forEach((item,index)=>{
  const key=`${item.kind}:${item.ref}`;keep.add(key);
  let row=list.querySelector(`[data-key="${CSS.escape(key)}"]`);
  if(!row){row=el("li","now-row");row.dataset.key=key;row.tabIndex=0}
  const steps=item.steps&&item.steps[1]?`<span class="steps" title="${item.steps[0]} of ${item.steps[1]} steps"><i style="width:${item.steps[0]/item.steps[1]*100}%"></i></span>`:"";
  const html=`<span>${pill(KIND_LABEL[item.kind]||item.kind[0].toUpperCase()+item.kind.slice(1),NOW_TONE[item.kind])}</span><span class="now-title" title="${esc(item.title)}">${esc(item.title)}</span><span class="now-detail" title="${esc(item.detail)}">${steps}${esc(item.detail)}</span><span class="now-time" data-since="${esc(item.at)}" data-live="${item.kind==="release"}"></span>`;
  if(row.dataset.html!==html){row.innerHTML=html;row.dataset.html=html}
  row.dataset.kind=item.kind;row.dataset.ref=item.ref;
  if(list.children[index]!==row)list.insertBefore(row,list.children[index]||null);
 });
 [...list.children].forEach(row=>{if(!keep.has(row.dataset.key))row.remove()});
 if(!shown.length&&!list.querySelector(".empty"))list.innerHTML=`<li class="empty">Nothing running right now</li>`;
 else if(shown.length)list.querySelector(".empty")?.remove();
 tick();
}
function tick(){
 document.querySelectorAll("[data-since]").forEach(n=>{const s=n.dataset.since;n.textContent=n.dataset.live==="true"?elapsed(s):ago(s)});
}

const TASK_KIND={task:"Task",ask:"Question",decide:"Decision",board:"Board",pending:"Decision",manual:"Item"};
const ACTION_LABEL={question:"Asked",complete:"Marked complete",reply:"Replied"};
const PROMPT={question:"What do you want to ask main?",complete:"Optional note for main",reply:"Your reply to main"};
const SEND={question:"Send question",complete:"Mark complete",reply:"Send reply"};
function citeUrl(cite){
 const [kind,...rest]=cite.split(":");const tail=rest.join(":");
 if(kind==="inbox"){const at=tail.lastIndexOf(":");return `/inbox/${tail.slice(0,at).split("/").map(encodeURIComponent).join("/")}?line=${tail.slice(at+1)}`}
 if(kind==="ccn")return `/ccn/${tail}`;
 if(kind==="pr"&&state.data)return `https://github.com/${state.data.drive.repo}/pull/${tail}`;
 return `/ask/read?ref=${encodeURIComponent(cite)}`;
}
function taskActions(row){
 const server=row.actions||[],seqs=new Set(server.map(a=>a.seq));
 return [...server,...(state.sent[row.cite]||[]).filter(a=>!a.seq||!seqs.has(a.seq))];
}
function taskStatus(row){
 return taskActions(row).map(a=>`<div class="sent"><span>${a.error?`<span class="bad-text">Not sent: ${esc(a.error)}</span>`:a.pending?"Sending…":`<b>${ACTION_LABEL[a.action]}</b> · sent to main ${esc(pt(a.at))}`}</span>${a.text?`<span>“${esc(a.text)}”</span>`:""}</div>${a.reply?`<div class="reply"><b>Main:</b> ${esc(a.reply.text)} <span class="muted">${esc(pt(a.reply.at))}</span></div>`:""}`).join("");
}
function renderTasks(){
 const rows=(state.data.owner||[]).filter(r=>matches(r.text));
 $("#task-count").textContent=rows.length?String(rows.length):"";
 const limit=state.tasksAll?rows.length:5;

}

function openDialog(title,html){
 state.returnFocus=document.activeElement;
 $("#detail-title").textContent=title;$("#detail-body").innerHTML=html;
 if(!$("#detail").open)$("#detail").showModal();
}
const dl=pairs=>`<dl class="detail-grid">${pairs.filter(([,v])=>v!=null&&v!==""&&!(Array.isArray(v)&&!v.length)).map(([k,v])=>`<dt>${esc(k)}</dt><dd>${v}</dd>`).join("")}</dl>`;
const chipsOf=(items,limit=60)=>`<div class="stack-chips">${items.slice(0,limit).map(s=>`<span>${esc(s)}</span>`).join("")}${items.length>limit?`<span>+${items.length-limit} more</span>`:""}</div>`;
function openRelease(number){
 const row=release(number);
 if(!row){openDialog(`Build #${number}`,`<p class="muted">This build is older than the ${(state.data.releases||[]).length} builds the dashboard keeps.</p>`);return}
 history.replaceState(null,"",`#release-${number}`);
 const status=`<div class="detail-status">${releaseState(row)}<span>${esc(KIND_LABEL[row.kind])} #${row.number}</span>${row.by?`<span>by ${esc(row.by)}</span>`:""}<span>started ${esc(pt(row.started_at||row.at))}</span>${row.minutes!=null?`<span>${row.live?"running for":"took"} ${dur(row.minutes)}</span>`:""}</div>`;
 const links=`<div class="detail-links">${ext(row.url,`Buildkite #${row.number} ↗`,"btn")}${row.slack?ext(row.slack,"Slack thread ↗","btn"):`<span class="btn missing">No Slack thread recorded</span>`}${row.pr_url?ext(row.pr_url,`PR #${row.pr} ↗`,"btn"):""}</div>`;
 const grid=dl([
  ["Failed at",row.failed_steps.length?esc(row.failed_steps.join("; ")):null],
  [APPLYING.has(row.kind)&&row.applies?"Ships":"PR at commit",row.pr?`#${row.pr} ${esc(row.pr_title||"")}`:null],
  ["Commit",esc(row.commit)],
  ["Running now",row.live&&row.now.length?esc(row.now.join("; ")):null],
  ["Progress",row.steps&&row.steps[1]?`${row.steps[0]} of ${row.steps[1]} steps passed`:null],
  ["Targets",row.targets.length?esc(row.targets.join(", ")):null],
  [`Stacks (${row.stacks.length})`,row.stacks.length?chipsOf(row.stacks):null],
  ["Skips environments",row.without.length?esc(row.without.join(", ")):null],
  ["Deselected",row.deselected.length?chipsOf(row.deselected):null],
  ["Deletes and replaces",row.destructive?"Allowed":null],
  ["Started from",row.launcher?`build #${row.launcher}`:null],
  ["Finished",row.finished_at?esc(pt(row.finished_at)):null],
 ]);
 openDialog(row.title,status+links+grid+`<details class="raw"><summary>Full build message</summary><p>${esc(row.message)}</p></details>`);
}
function openIncident(key){
 const g=(state.data.incidents||[]).find(x=>x.key===key);if(!g)return;
 const status=`<div class="detail-status">${pill(g.status[0].toUpperCase()+g.status.slice(1),INCIDENT_TONE[g.status])}<span>opened ${esc(pt(g.opened_at))}</span><span>updated ${esc(ago(g.at))}</span></div>`;
 const grid=dl([["Lanes",esc(g.lanes.join(", "))],["First report",linkify(g.summary)],["Folder",g.folder?esc(g.folder):null],["Files",g.files?esc(g.files):null]]);
 const timeline=`<ol class="timeline">${g.records.map(r=>`<li><span class="muted">${esc(pt(r.at))}<br>${pill(r.kind,INCIDENT_TONE[{incident:"open",evidence:"investigating",mechanism:"mechanism found","fix-live":"fix live",recovered:"recovered","not-ours":"not ours",duplicate:"duplicate",done:"done"}[r.kind]])}</span><span><b>${esc(r.lane)}</b> ${linkify(r.text)}</span></li>`).join("")}</ol>`;
 history.replaceState(null,"",`#incident-${encodeURIComponent(key)}`);
 openDialog(g.sighting?g.title:g.title,status+grid+timeline);
}
function openStack(index){
 const row=rowsOf("platy-stacks")[index];if(!row)return;
 const [label,cls]=DEPLOYABLE[row.deployable]||[row.deployable,""];
 const links=`<div class="detail-links">${row.platy_url?ext(row.platy_url,`Last Platy release #${row.platy_build} ↗`,"btn"):""}${row.cli_url?ext(row.cli_url,`Last CLI deploy #${row.cli_build} ↗`,"btn"):""}${row.reason_url?ext(row.reason_url,"Blocker record ↗","btn"):""}</div>`;
 openDialog(row.stack,`<div class="detail-status">${pill(label,cls)}${pill(row.zero,row.zero==="0/0"?"ok":"bad")}<span>${esc(row.target)}</span></div>${links}${dl([["Why",row.reason?esc(row.reason):null],["Lane on it",esc(row.doing_lane||"Nobody yet")],["Lane's latest",row.doing?esc(row.doing):null],["Last Platy deploy",row.platy_at?`${esc(pt(row.platy_at))} · ${esc(row.platy_state||"")}`:"Never"],["Last pass",row.last_pass_at?esc(pt(row.last_pass_at)):null],["Applied commit",esc(row.applied||"")],["Commits behind dev",esc(row.behind||"")]])}`);
}
function openLane(name){
 const l=(state.data.lanes||[]).find(x=>x.lane===name);if(!l)return;
 openDialog(l.lane,`<div class="detail-status">${pill(l.kind,"info")}<span>${esc(pt(l.at))} · ${esc(ago(l.at))}</span>${l.to?.length?`<span>to ${esc(l.to.join(", "))}</span>`:""}</div><p class="md">${linkify(l.text)}</p>`);
}
function openTask(cite){
 const row=(state.data.owner||[]).find(r=>r.cite===cite);if(!row)return;
 const href=row.kind==="board"?row.url:row.url||citeUrl(row.cite);
 openDialog(TASK_KIND[row.kind]||row.kind,`<p class="md">${linkify(row.title||row.text)}</p>${dl([["State",esc(row.state||"")],["Raised",row.at?esc(`${pt(row.at)} · ${ago(row.at)}`):null]])}<div class="detail-links" style="margin-top:16px">${ext(href,row.kind==="board"?"Open board ↗":"Open source ↗","btn")}</div>`);
}
const landedRows=prs=>`<div class="plain-rows">${prs.map(p=>`<a class="plain-row" href="${esc(p.url)}" target="_blank" rel="noopener"><b>#${p.pr}</b><span>${esc(p.title)}</span><span class="sub">${esc(p.lane)} · ${esc(pt(p.at))}</span></a>`).join("")}</div>`;
function openHour(index){
 const h=state.data.overview.charts.landed[index];if(!h)return;
 openDialog(`Landed at ${hourLabel(h.hour)}`,h.prs.length?landedRows(h.prs):`<p class="empty">Nothing landed that hour</p>`);
}
function openHold(seq){
 const item=state.data.overview.live.find(i=>i.kind==="hold"&&String(i.ref)===String(seq));if(!item)return;
 openDialog(item.title,`<div class="detail-status">${pill("Hold","warn")}<span>${esc(pt(item.at))}</span></div><p class="md">${linkify(item.detail)}</p>`);
}
function openGroup(name,filter){
 const node=document.getElementById("g-"+name);
 if(filter&&name==="Releases")state.releaseFilter=filter;
 if(filter&&name==="Stacks")state.stackFilter=filter;
 delete state.painted["primary:"+name];
 node.open=true;renderGroup(node,name);
 node.scrollIntoView({behavior:reduced()?"auto":"smooth",block:"start"});
}
function drill(target){
 const [what,arg]=target.split(":");
 if(what==="stacks")openGroup("Stacks",arg);
 else if(what==="releases")openGroup("Releases",arg);
 else if(what==="incidents")openGroup("Incidents");
 else if(what==="lanes")openGroup("Lanes");
 else if(what==="landed"){const hours=state.data.overview.charts.landed,today=hours.flatMap(h=>h.prs).filter(p=>sameDay(new Date(p.at),new Date()));openDialog("PRs landed today",today.length?landedRows(today):`<p class="empty">Nothing landed today</p>`)}
}

document.addEventListener("click",e=>{
 const t=e.target;
 const relNode=t.closest("[data-release]");if(relNode&&!t.closest(".links a")){openRelease(Number(relNode.dataset.release));return}
 const d=t.closest("[data-drill]");if(d){drill(d.dataset.drill);return}
 const z=t.closest("[data-zero]");if(z){openGroup("Stacks",z.dataset.zero);return}
 const h=t.closest("[data-hour]");if(h){openHour(Number(h.dataset.hour));return}
 const inc=t.closest("[data-incident]");if(inc){openIncident(inc.dataset.incident);return}
 const st=t.closest("[data-stack]");if(st){openStack(Number(st.dataset.stack));return}
 const ln=t.closest("[data-lane]");if(ln){openLane(ln.dataset.lane);return}
 const tk=t.closest("[data-task]");if(tk){openTask(tk.dataset.task);return}
 const nowRow=t.closest(".now-row");if(nowRow){const k=nowRow.dataset.kind,r=nowRow.dataset.ref;if(k==="release")openRelease(Number(r));else if(k==="incident")openIncident(r);else if(k==="lane")openLane(r);else openHold(r);return}
 const nf=t.closest("[data-now]");if(nf){state.nowFilter=nf.dataset.now;delete state.painted["now-chips"];renderNow();return}
 const rf=t.closest("[data-release-filter]");if(rf){state.releaseFilter=rf.dataset.releaseFilter;state.expanded.Releases=false;renderGroup($("#g-Releases"),"Releases");return}
 const sf=t.closest("[data-stack-filter]");if(sf){state.stackFilter=sf.dataset.stackFilter;state.expanded.Stacks=false;renderGroup($("#g-Stacks"),"Stacks");return}
 const more=t.closest("[data-more]");if(more){state.expanded[more.dataset.more]=true;renderGroup($("#g-"+more.dataset.more),more.dataset.more);return}
 const act=t.closest("[data-act]");if(act){const node=act.closest(".task"),form=node.querySelector(".composer");form.hidden=false;form.dataset.action=act.dataset.act;form.querySelector("textarea").placeholder=PROMPT[act.dataset.act];form.querySelector("[type=submit]").textContent=SEND[act.dataset.act];form.querySelector(".composer-error").textContent="";node.querySelectorAll("[data-act]").forEach(b=>b.setAttribute("aria-pressed",b===act));form.querySelector("textarea").focus();return}
 const cancel=t.closest("[data-cancel]");if(cancel){const form=cancel.closest(".composer");form.hidden=true;form.querySelector("textarea").value="";return}
 const clipNode=t.closest(".clip");if(clipNode&&!t.closest("a")&&!t.closest("button"))clipNode.classList.toggle("open");
 const th=t.closest("th[data-sort]");if(th&&th.closest(".view")){const id=th.closest(".view").dataset.view,field=th.dataset.sort,prev=state.sort[id];state.sort[id]={field,desc:prev&&prev.field===field?!prev.desc:true};delete state.painted[id];render()}
});
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches(".now-row,[role=button]")){e.preventDefault();e.target.click()}});
document.addEventListener("submit",e=>{
 const form=e.target.closest(".composer");if(!form)return;
 e.preventDefault();
 const text=form.querySelector("textarea").value.trim(),action=form.dataset.action;
 if(action!=="complete"&&!text){form.querySelector(".composer-error").textContent="Write something first";return}
 form.hidden=true;form.querySelector("textarea").value="";
 sendAction(form.closest(".task"),action,text);
});
document.addEventListener("toggle",e=>{
 if(e.target.matches(".group")&&e.target.open&&state.data)renderGroup(e.target,e.target.dataset.group);
 if(e.target.matches(".view")&&e.target.open){const id=e.target.dataset.view;paint(e.target.querySelector(".view-body"),id,cardHtml(filteredView(viewById(id))))}
},true);
document.addEventListener("input",e=>{
 const box=e.target.closest(".filters");if(!box)return;
 const id=box.dataset.view,f=state.filters[id]||(state.filters[id]={lane:"",verb:"",text:""});f[e.target.dataset.filter]=e.target.value;
 const body=document.getElementById("v-"+id).querySelector(".view-body"),focus=e.target.dataset.filter,caret=e.target.selectionStart;
 body.innerHTML=cardHtml(filteredView(viewById(id)));delete state.painted[id];
 const again=body.querySelector(`[data-filter="${focus}"]`);again.focus();if(caret!=null&&again.setSelectionRange)again.setSelectionRange(caret,caret);
});
const tip=$("#tip");
document.addEventListener("mouseover",e=>{const n=e.target.closest("[data-tip]");if(n){tip.textContent=n.dataset.tip;tip.classList.add("show")}});
document.addEventListener("mousemove",e=>{if(tip.classList.contains("show")){const x=Math.min(e.clientX+14,innerWidth-tip.offsetWidth-8);tip.style.left=x+"px";tip.style.top=(e.clientY+16)+"px"}});
document.addEventListener("mouseout",e=>{if(e.target.closest("[data-tip]"))tip.classList.remove("show")});
$("#now-more").addEventListener("click",()=>{state.nowOpen=!state.nowOpen;renderNow()});
$("#tasks-more").addEventListener("click",()=>{state.tasksAll=!state.tasksAll;renderTasks()});
$("#detail-close").addEventListener("click",()=>$("#detail").close());
$("#detail").addEventListener("close",()=>{if(location.hash)history.replaceState(null,"",location.pathname);state.returnFocus?.focus?.({preventScroll:true})});
$("#detail").addEventListener("click",e=>{if(e.target===$("#detail")){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.target.close()}});
$("#search").addEventListener("input",e=>{
 state.query=e.target.value;state.painted={};
 if(state.query)GROUPS.forEach(name=>{const n=document.getElementById("g-"+name);if(n&&name!=="Activity")n.open=true});
 render();
});
let first=true;
async function refresh(){
 try{
  const r=await fetch("/state.json",{cache:"no-store"});if(!r.ok)throw new Error(`HTTP ${r.status}`);
  state.data=await r.json();render();
  if(first&&state.data.generated_at){first=false;const m=/^#(release|incident)-(.+)$/.exec(location.hash);if(m&&m[1]==="release")openRelease(Number(m[2]));else if(m)openIncident(decodeURIComponent(m[2]))}
 }catch(e){$("#status").className="status disconnected";$("#meta").textContent="Disconnected";$("#errors").textContent="Dashboard unreachable: "+e.message}
}
refresh();
setInterval(refresh,REFRESH_MS);
setInterval(tick,1000);
</script>
</body>
</html>
