version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - contextcheck
    - durationcheck
    - errcheck
    - errorlint
    - gosec
    - govet
    - ineffassign
    - prealloc
    - revive
    - staticcheck
    - unused
  settings:
    gosec:
      excludes:
        - G104
        - G201
        - G202
        - G204
        - G304
  exclusions:
    presets:
      - comments
      - std-error-handling
    rules:
      - linters: [revive]
        text: blank-imports

formatters:
  enable:
    - gofumpt
    - goimports
