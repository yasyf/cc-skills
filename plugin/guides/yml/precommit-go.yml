# Go: gofumpt + goimports formatting and the golangci-lint suite, both driven
# by the repo's .golangci.yml. Continues the `repos:` list precommit-base opens.
  - repo: https://github.com/golangci/golangci-lint
    rev: v2.12.2
    hooks:
      # prek forces GOTOOLCHAIN=local; auto lets `go` fetch the patch a consumer's
      # go.mod asks for. Raise the pin for a go.mod on a newer minor.
      - id: golangci-lint-fmt
        language_version: '1.26.10'
        env: {GOTOOLCHAIN: auto}
      - id: golangci-lint
        language_version: '1.26.10'
        env: {GOTOOLCHAIN: auto}
        args: [--allow-serial-runners]
