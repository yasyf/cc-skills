name: long-running pack release

on:
  workflow_run:
    workflows: [Autobump]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Publish the pack tree of each recent long-running tag that has no release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for tag in $(git tag --list 'long-running--v*' --sort=-version:refname | head -n 20); do
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              continue
            fi
            version="${tag#long-running--v}"
            name="long-running_${version}.tar.gz"
            dist="$RUNNER_TEMP/$tag"
            mkdir -p "$dist"
            git archive --format=tar "$tag:plugins/long-running" | gzip -n > "$dist/$name"
            test "$(tar -xzOf "$dist/$name" .claude-plugin/plugin.json | jq -r .version)" = "$version"
            (cd "$dist" && sha256sum "$name" > checksums.txt)
            gh release create "$tag" "$dist"/* \
              --verify-tag \
              --title "long-running $version" \
              --notes "The long-running plugin tree at $tag, which lr launch worker installs on a Sprite." \
              --latest=false
          done
