name: long-running lr release

on:
  push:
    branches: [main]
    paths:
      - "plugins/long-running/lr/**"
      - "!plugins/long-running/lr/**/*_test.go"
      - "!plugins/long-running/lr/**/testdata/**"
      - ".github/workflows/long-running-lr-release.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: write

env:
  VERSION: 0.${{ github.run_number }}.${{ github.run_attempt }}
  TAG: lr--v0.${{ github.run_number }}.${{ github.run_attempt }}
  DESCRIPTOR: plugins/long-running/bin/lr.binrun

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    outputs:
      version: ${{ env.VERSION }}
      tag: ${{ env.TAG }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: plugins/long-running/lr/go.mod
          cache-dependency-path: plugins/long-running/lr/go.sum
      - uses: yasyf/homebrew-tap/.github/actions/import-developer-id@19c3d5013032ad9c88f9a8f1170d1f366c19b8d9
        with:
          p12: ${{ secrets.MACOS_SIGN_P12 }}
          p12-password: ${{ secrets.MACOS_SIGN_PASSWORD }}
          notary-key: ${{ secrets.MACOS_NOTARY_KEY }}
          notary-key-id: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          notary-issuer-id: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
      - name: Build, sign and archive per platform
        env:
          MACOS_CODESIGN_IDENTIFIER: com.yasyf.lr
        run: |
          set -euo pipefail
          dist="$GITHUB_WORKSPACE/dist"
          mkdir -p "$dist"
          for target in darwin_arm64 linux_amd64 linux_arm64; do
            stage="$RUNNER_TEMP/$target"
            mkdir -p "$stage"
            (
              cd plugins/long-running/lr
              CGO_ENABLED=0 GOOS="${target%_*}" GOARCH="${target#*_}" go build -trimpath \
                -ldflags "-s -w -X main.appVersion=$VERSION" \
                -o "$stage/lr" ./cmd/lr
            )
            bash "$MACOS_CODESIGN_SCRIPT" "$stage/lr" "$target"
            tar -czf "$dist/lr_${VERSION}_$target.tar.gz" -C "$stage" lr
          done
          test "$("$RUNNER_TEMP/darwin_arm64/lr" --version)" = "lr version $VERSION"
          cp plugins/long-running/lr/internal/deskhost/desk-sync.sh "$dist/desk-sync.sh"
          (cd "$dist" && shasum -a 256 ./*.tar.gz ./desk-sync.sh | sed 's| \./| |' > checksums.txt)
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "lr $VERSION" \
            --notes "The lr binary built from $GITHUB_SHA for the long-running plugin." \
            --latest=false

  pin:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.build.outputs.version }}
      TAG: ${{ needs.build.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Render the descriptor from the published assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          dist="$RUNNER_TEMP/dist"
          mkdir -p "$dist"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$dist"
          (cd "$dist" && sha256sum --check --strict checksums.txt)
          platforms='{}'
          for pair in macos-aarch64:darwin_arm64 linux-x86_64:linux_amd64 linux-aarch64:linux_arm64; do
            name="lr_${VERSION}_${pair#*:}.tar.gz"
            platforms="$(jq \
              --arg key "${pair%%:*}" \
              --argjson size "$(stat -c%s "$dist/$name")" \
              --arg digest "$(awk -v n="$name" '$2 == n {print $1}' "$dist/checksums.txt")" \
              --arg repo "$GITHUB_REPOSITORY" \
              --arg name "$name" \
              '.[$key] = {size: $size, hash: "sha256", digest: $digest, format: "tar.gz", path: "lr", providers: [{type: "github-release", repo: $repo, tag: env.TAG, name: $name}]}' \
              <<<"$platforms")"
          done
          {
            echo '#!/usr/bin/env binrun'
            jq -n --argjson platforms "$platforms" '{schema: 1, name: "lr", kind: "release-binary", version: {static: env.VERSION}, platforms: $platforms}'
          } > "$DESCRIPTOR"
          chmod +x "$DESCRIPTOR"
      - name: Probe the pinned binary through the shim's runner
        run: test "$(plugins/long-running/scripts/binrun.sh "$DESCRIPTOR" --version)" = "lr version $VERSION"
      - uses: astral-sh/setup-uv@v8.2.0
      - name: Refuse a pin that lacks a verb or flag the pack names
        env:
          UV_PYTHON: "3.14"
        run: uv run --locked --project plugins/long-running pytest plugins/long-running/tests/test_lr_verbs.py -q
      - name: Land the descriptor on main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DESCRIPTOR"
          git commit -m "chore(long-running): pin lr $VERSION [skip ci]"
          for _ in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::could not push the descriptor after 5 attempts"
          exit 1
      - name: Grade the descriptor commit and bump the plugin onto it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run long-running-ci.yml --ref main
          gh workflow run autobump.yml --ref main

  batch:
    needs: pin
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Hold the concurrency group so pushes in the next 10 minutes release as one, until the pack waits on a build
        run: |
          for _ in $(seq 30); do
            git fetch -q origin main
            for sha in $(git log --format=%H "$GITHUB_SHA..origin/main" -- plugins/long-running/lr); do
              if git show --format= --name-only "$sha" -- plugins/long-running | grep -qv '^plugins/long-running/lr/'; then
                exit 0
              fi
            done
            sleep 20
          done
