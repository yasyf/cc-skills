name: long-running native MATCH

on:
  push:
    branches: [main]
    tags: ["long-running--v*"]
    paths:
      - "plugins/long-running/skills/long-running/scripts/long_running/match_session.py"
      - "plugins/long-running/skills/long-running/scripts/long_running/ruling_documents.py"
      - "plugins/long-running/skills/long-running/scripts/long_running/rulings.py"
      - "plugins/long-running/skills/long-running/scripts/rulings.py"
      - "plugins/long-running/tests/match_corpus_immutable818_characterization.py"
      - "plugins/long-running/tests/native_match_ci_grade.py"
      - "plugins/long-running/tests/native_match_integration.py"
      - "plugins/long-running/tests/test_match_session.py"
      - "plugins/long-running/tests/test_rulings.py"
      - "plugins/long-running/tests/test_rulings_owned_hooks.py"
      - ".github/workflows/long-running-native-match.yml"
  schedule:
    - cron: "31 11 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: long-running-native-match-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native-match:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      GOMAXPROCS: "2"
      GOFLAGS: -p=2
      CARGO_BUILD_JOBS: "2"
      UV_PYTHON: "3.14"
      LR_TEST_SCALE: run
    steps:
      - uses: actions/checkout@v7
        with:
          repository: yasyf/cc-context
          ref: 1cc89874f672d6fd821051a4af0d724a3e9102fd
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: lr-current
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: 0c422ce358746df22168df8e02e8a42ee3b139e8
          path: lr-baseline
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: ./.github/actions/wasm
      - uses: astral-sh/setup-uv@v8.2.0
      - name: Exact public SDK and native fixture build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native-match"
          test "$(git rev-parse HEAD)" = 1cc89874f672d6fd821051a4af0d724a3e9102fd
          test "$(git -C lr-baseline rev-parse HEAD)" = 0c422ce358746df22168df8e02e8a42ee3b139e8
          go mod verify
          go list -m -json github.com/yasyf/cc-notes > "$RUNNER_TEMP/native-match/sdk.json"
          python3 - <<'PYSDK'
          import json, os, pathlib
          source = json.loads((pathlib.Path(os.environ["RUNNER_TEMP"]) / "native-match/sdk.json").read_text())
          assert source["Version"] == "v0.74.40", source
          assert source["Sum"] == "h1:SgnWbAoOsCRayI1ZxCoLQcij0FIE0074c3qDpSca0Hs=", source
          assert "Replace" not in source, source
          PYSDK
          go test -c -o "$RUNNER_TEMP/native-match/ccx-cli.test" ./internal/cli
      - name: Immutable818 nineteen caller characterization cases
        shell: bash
        run: |
          set -euo pipefail
          cp lr-current/plugins/long-running/tests/match_corpus_immutable818_characterization.py lr-baseline/plugins/long-running/tests/
          uv run --locked --project lr-baseline/plugins/long-running pytest -c lr-baseline/plugins/long-running/pyproject.toml lr-baseline/plugins/long-running/tests/match_corpus_immutable818_characterization.py -q -s --junitxml="$RUNNER_TEMP/native-match/immutable.xml" | tee "$RUNNER_TEMP/native-match/immutable.log"
      - name: Actual immutable818 warm-body negatives
        shell: bash
        env:
          CCX_NATIVE_MATCH_TEST_BINARY: ${{ runner.temp }}/native-match/ccx-cli.test
          LR_MATCH_BASELINE_SCRIPTS: ${{ github.workspace }}/lr-baseline/plugins/long-running/skills/long-running/scripts
          LR_MATCH_COST_DRIVER: legacy
        run: |
          set -euo pipefail
          for count in 32 10000; do
            negative="$RUNNER_TEMP/native-match/old-$count"
            if uv run --locked --project lr-current/plugins/long-running pytest -c lr-current/plugins/long-running/pyproject.toml "lr-current/plugins/long-running/tests/native_match_integration.py::test_actual_match_warm_body_work_and_immutable818_output[$count]" -q -s --junitxml="$negative.xml" > "$negative.log" 2>&1; then
              cat "$negative.log"
              exit 1
            else
              code=$?
            fi
            cat "$negative.log"
            test "$code" -eq 1
            grep -F 'unchanged match still materializes answer or mirror bodies' "$negative.log"
            grep -F 'NATIVE_PYTHON_MATCH_WORK' "$negative.log"
          done
      - name: Actual native MATCH policies and warm work
        shell: bash
        env:
          CCX_NATIVE_MATCH_TEST_BINARY: ${{ runner.temp }}/native-match/ccx-cli.test
          LR_MATCH_BASELINE_SCRIPTS: ${{ github.workspace }}/lr-baseline/plugins/long-running/skills/long-running/scripts
          LR_MATCH_COST_DRIVER: current
        run: |
          set -euo pipefail
          uv run --locked --project lr-current/plugins/long-running pytest -c lr-current/plugins/long-running/pyproject.toml lr-current/plugins/long-running/tests/native_match_integration.py -q -s --junitxml="$RUNNER_TEMP/native-match/current.xml" | tee "$RUNNER_TEMP/native-match/current.log"
          uv run --locked --project lr-current/plugins/long-running pytest -c lr-current/plugins/long-running/pyproject.toml lr-current/plugins/long-running/tests/test_match_session.py lr-current/plugins/long-running/tests/test_rulings.py lr-current/plugins/long-running/tests/test_rulings_owned_hooks.py -q -s --junitxml="$RUNNER_TEMP/native-match/transport-and-policy.xml" | tee "$RUNNER_TEMP/native-match/transport-and-policy.log"
          python3 lr-current/plugins/long-running/tests/native_match_ci_grade.py "$RUNNER_TEMP/native-match"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-match-${{ matrix.os }}
          path: ${{ runner.temp }}/native-match
          if-no-files-found: error
