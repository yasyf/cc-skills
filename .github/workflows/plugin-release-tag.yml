name: Plugin release tag

on:
  workflow_call:
    inputs:
      release-workflow:
        type: string
        required: true
      paths:
        type: string
        default: ""
      ci-workflow:
        type: string
        default: ""
      min-interval:
        type: number
        default: 0
      dry-run:
        type: boolean
        default: false
      script-ref:
        type: string
        default: "plugin-v1"

jobs:
  release-tag:
    if: >-
      (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch) ||
      (inputs.ci-workflow != '' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'))
    runs-on: ubuntu-latest
    env:
      # TODO: drop once this job runs green on CPython 3.15; uv 0.13.0 defaults to 3.15.
      UV_PYTHON: "3.14"
    concurrency:
      group: "plugin-release-tag-${{ github.repository }}"
      cancel-in-progress: false
    permissions:
      contents: write
      actions: write
    steps:
      - name: Resolve the green commit to release
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
          CI_WORKFLOW: ${{ inputs.ci-workflow }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GRADED: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ] || [ "$GITHUB_EVENT_NAME" = workflow_run ]; then
            echo "sha=$GRADED" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sha="$(gh run list -R "$GITHUB_REPOSITORY" --workflow "$CI_WORKFLOW" --branch "$DEFAULT_BRANCH" \
            --event push --status success --limit 1 --json headSha --jq '.[0].headSha')"
          test -n "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.commit.outputs.sha }}
          fetch-depth: 0

      - name: Resolve pinned script ref
        id: script-ref
        run: |
          if [ "${{ github.repository }}" = "yasyf/cc-skills" ]; then
            REF="${{ github.sha }}"
          else
            REF="${{ inputs.script-ref }}"
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          repository: yasyf/cc-skills
          ref: ${{ steps.script-ref.outputs.ref }}
          path: .autobump-src
          sparse-checkout: .github/scripts

      - uses: astral-sh/setup-uv@v8.2.0

      - name: Tag and release the pushed head
        env:
          RELEASE_WORKFLOW: ${{ inputs.release-workflow }}
          RELEASE_DRY_RUN: ${{ inputs.dry-run }}
          RELEASE_PATHS: ${{ inputs.paths }}
          RELEASE_MIN_INTERVAL: ${{ github.event_name != 'workflow_dispatch' && inputs.min-interval || 0 }}
          GH_TOKEN: ${{ github.token }}
        run: uv run .autobump-src/.github/scripts/release_tag.py
