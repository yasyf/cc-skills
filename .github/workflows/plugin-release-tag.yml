name: Plugin release tag

on:
  workflow_call:
    inputs:
      release-workflow:
        type: string
        required: true
      dry-run:
        type: boolean
        default: false
      script-ref:
        type: string
        default: "plugin-v1"

jobs:
  release-tag:
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    env:
      # TODO: drop once this job runs green on CPython 3.15; uv 0.13.0 defaults to 3.15.
      UV_PYTHON: "3.14"
    concurrency:
      group: "plugin-release-tag-${{ github.repository }}"
      cancel-in-progress: false
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve pinned script ref
        id: script-ref
        run: |
          if [ "${{ github.repository }}" = "yasyf/cc-skills" ]; then
            REF="${{ github.sha }}"
          else
            REF="${{ inputs.script-ref }}"
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          repository: yasyf/cc-skills
          ref: ${{ steps.script-ref.outputs.ref }}
          path: .autobump-src
          sparse-checkout: .github/scripts

      - uses: astral-sh/setup-uv@v8.2.0

      - name: Tag and release the pushed head
        env:
          RELEASE_WORKFLOW: ${{ inputs.release-workflow }}
          RELEASE_DRY_RUN: ${{ inputs.dry-run }}
          GH_TOKEN: ${{ github.token }}
        run: uv run .autobump-src/.github/scripts/release_tag.py
