name: long-running remote routing CI

on:
  push:
    branches: [main]
    tags: ["long-running--v*"]
    paths:
      - "plugins/long-running/**"
      - ".github/workflows/lr-remote-routing.yml"
  pull_request:
    paths:
      - "plugins/long-running/**"
      - ".github/workflows/lr-remote-routing.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: "3.14"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.2.0
      - uses: actions/checkout@v7
        with:
          ref: d37c9e67cd6632faa9bd90805188b4a5fb29216e
          path: .ci-remote-routing-baseline
          persist-credentials: false
      - name: Immutable802 negative control
        shell: bash
        run: |
          baseline=.ci-remote-routing-baseline/plugins/long-running
          test "$(git -C .ci-remote-routing-baseline rev-parse HEAD)" = d37c9e67cd6632faa9bd90805188b4a5fb29216e
          cp plugins/long-running/tests/test_desk_runner.py "$baseline/tests/test_desk_runner.py"
          negative="$RUNNER_TEMP/lr-remote-routing-old.log"
          if uv run --locked --project "$baseline" pytest -c "$baseline/pyproject.toml" "$baseline/tests/test_desk_runner.py::test_a_selected_remote_lane_clears_only_the_local_route_override[inherited]" -q >"$negative" 2>&1; then
            cat "$negative"
            exit 1
          fi
          cat "$negative"
          grep -F 'selected remote route retained local override' "$negative"
          grep -F '1 failed' "$negative"
      - name: Fixed affected cases and preserved behavior
        shell: bash
        run: uv run --locked --project plugins/long-running pytest plugins/long-running/tests/test_desk_runner.py::test_a_selected_remote_lane_clears_only_the_local_route_override plugins/long-running/tests/test_desk_runner.py::test_an_ordinary_lane_launches_on_a_sprite_whatever_the_mac_load plugins/long-running/tests/test_desk_runner.py::test_a_lane_placed_or_forced_local_never_leaves_the_mac plugins/long-running/tests/test_desk_runner.py::test_a_sprite_launch_that_stopped_before_worker_start_fails_and_never_launches_locally plugins/long-running/tests/test_desk_runner.py::test_a_sprite_launch_that_may_have_reached_worker_start_is_unverifiable_and_never_launches_locally -q -s --junitxml="$RUNNER_TEMP/lr-remote-routing-current.xml" | tee "$RUNNER_TEMP/lr-remote-routing-current.log"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lr-remote-routing-${{ runner.os }}
          path: ${{ runner.temp }}/lr-remote-routing-*
          if-no-files-found: error
