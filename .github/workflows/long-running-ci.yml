name: long-running CI

on:
  push:
    paths:
      - "plugins/long-running/**"
      - "plugins/live-dashboard/skills/live-dashboard/scripts/**"
      - ".github/workflows/long-running-ci.yml"
  pull_request:
    paths:
      - "plugins/long-running/**"
      - "plugins/live-dashboard/skills/live-dashboard/scripts/**"
      - ".github/workflows/long-running-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # TODO: drop once isal, thinc, and ast-grep-py ship CPython 3.15 wheels; uv 0.13.0 defaults to 3.15 and their source builds fail.
      UV_PYTHON: "3.14"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.2.0
      - name: pytest
        run: uv run --locked --project plugins/long-running pytest plugins/long-running/tests -q
      - name: capt-hook pack test
        run: uvx --isolated 'capt-hook>=12.107.12' pack test plugins/long-running
      - name: installed state package
        run: |
          uv build --project plugins/long-running --wheel --out-dir "$RUNNER_TEMP/long-running-wheel"
          uv venv "$RUNNER_TEMP/long-running-venv"
          uv pip install --python "$RUNNER_TEMP/long-running-venv/bin/python" "$RUNNER_TEMP"/long-running-wheel/*.whl
          "$RUNNER_TEMP/long-running-venv/bin/python" -I -m long_running.actions --help
          "$RUNNER_TEMP/long-running-venv/bin/python" -I -c 'from long_running.roster_service import mailbox_of; from long_running.rosters import RosterIndex'
      - name: action-store scaling costs
        run: uv run --locked --project plugins/long-running python plugins/long-running/benchmarks/action-store.py
      - name: mailbox index scaling costs
        run: uv run --locked --project plugins/long-running python plugins/long-running/benchmarks/mailbox-index.py > mailbox-index-linux.json
      - uses: actions/upload-artifact@v7
        with:
          name: mailbox-index-linux
          path: mailbox-index-linux.json
  mailbox-macos:
    runs-on: macos-latest
    env:
      UV_PYTHON: "3.14"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.2.0
      - name: native mailbox freshness and lifecycle
        run: uv run --locked --project plugins/long-running pytest plugins/long-running/tests/test_rosters.py plugins/long-running/tests/test_inboxes.py -q
      - name: mailbox index scaling costs
        run: uv run --locked --project plugins/long-running python plugins/long-running/benchmarks/mailbox-index.py > mailbox-index-macos.json
      - uses: actions/upload-artifact@v7
        with:
          name: mailbox-index-macos
          path: mailbox-index-macos.json
