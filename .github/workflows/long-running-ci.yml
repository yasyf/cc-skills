      - uses: actions/checkout@v7
        with:
          repository: yasyf/cc-inbox
          ref: 9f5cfdf4dc61bde964713bea7d47ffab928e7afc
          path: .ci-machine-cci
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: b1f48b3c9e38ee2b4851f3d1b5f6e58c38125c02
          path: .ci-post-legacy
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
