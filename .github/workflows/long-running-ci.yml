name: long-running CI

on:
  push:
    branches: [main]
    paths:
      - "plugins/long-running/**"
      - ".github/workflows/long-running-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "plugins/long-running/**"
      - ".github/workflows/long-running-ci.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.2.0
      - name: smoke
        run: plugins/long-running/tools/smoke

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pip install pytest pytest-xdist pytest-timeout "spawnllm>=0.17.7"
      - name: pytest
        run: python -m pytest plugins/long-running/tests -q -n auto --durations=25 --timeout=30
      - uses: astral-sh/setup-uv@v8.2.0
      - name: capt-hook pack test
        env:
          UV_PYTHON: "3.14"
          LONG_RUNNING_STATE: ${{ github.workspace }}/plugins/long-running/capt-hook/hooks/tests/fixtures/state
        run: uvx --isolated 'capt-hook>=12.121.70' pack test plugins/long-running

  foreign-names:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: no repository specifics added to long-running
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD~1' }}
        run: plugins/long-running/tools/foreign-names "$BASE"
      - name: no repository specifics anywhere in long-running
        run: plugins/long-running/tools/foreign-names --tree
