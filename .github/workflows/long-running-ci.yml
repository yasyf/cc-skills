name: long-running CI

on:
  push:
    branches: [main]
    tags: ["long-running--v*", "live-dashboard--v*"]
    paths:
      - "plugins/long-running/**"
      - "plugins/live-dashboard/skills/live-dashboard/scripts/**"
      - ".github/workflows/long-running-ci.yml"
  pull_request:
    paths:
      - "plugins/long-running/**"
      - "plugins/live-dashboard/skills/live-dashboard/scripts/**"
      - ".github/workflows/long-running-ci.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # TODO: drop once isal, thinc, and ast-grep-py ship CPython 3.15 wheels; uv 0.13.0 defaults to 3.15 and their source builds fail.
      UV_PYTHON: "3.14"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.2.0
      - uses: actions/checkout@v7
        with:
          ref: c729f3d928531710b7cdc0b5137c099058a01460
          path: .ci-ruling-binary-baseline
          persist-credentials: false
      - name: Immutable ruling binary prefix negative controls
        run: |
          test "$(git -C .ci-ruling-binary-baseline rev-parse HEAD)" = c729f3d928531710b7cdc0b5137c099058a01460
          baseline=.ci-ruling-binary-baseline/plugins/long-running
          cp plugins/long-running/tests/test_ruling_binary_reader.py "$baseline/tests/test_ruling_binary_reader.py"
          for caller in reader index readback classify; do
            case "$caller" in
              reader) node=test_ruling_reader_binary_prefix ;;
              index) node=test_document_index_binary_prefix ;;
              readback) node=test_readback_sweeper_binary_prefix ;;
              classify) node=test_classify_sweeper_binary_prefix ;;
            esac
            negative="$RUNNER_TEMP/ruling-binary-$caller-negative.log"
            if uv run --locked --project plugins/long-running pytest -c "$baseline/pyproject.toml" "$baseline/tests/test_ruling_binary_reader.py::$node[large]" -q -s > "$negative" 2>&1; then
              cat "$negative"
              exit 1
            fi
            cat "$negative"
            grep -F "binary ruling $caller read" "$negative"
            grep -F '1 failed' "$negative"
          done
      - name: Ruling binary prefix bytes and text parity
        run: uv run --locked --project plugins/long-running pytest plugins/long-running/tests/test_ruling_binary_reader.py -q -s
      - uses: actions/checkout@v7
        with:
          ref: 963e964f15a919b6f0588fba2d7dd68de41c4d91
          path: .ci-register-orphan-baseline
      - name: Immutable register query orphan reproduction and CLI oracle
        run: |
          test "$(git -C .ci-register-orphan-baseline rev-parse HEAD)" = 963e964f15a919b6f0588fba2d7dd68de41c4d91
          git fetch --no-tags --depth=1 origin 1ddc785a2796f63677408f168e590e95a6fc02b0
          git show 1ddc785a2796f63677408f168e590e95a6fc02b0:plugins/long-running/tests/test_register_reads.py > .ci-register-orphan-baseline/plugins/long-running/tests/test_register_reads.py
          if uv run --locked --project plugins/long-running pytest -c .ci-register-orphan-baseline/plugins/long-running/pyproject.toml .ci-register-orphan-baseline/plugins/long-running/tests/test_register_reads.py -q -s -k test_register_query_timeout_leaves_no_child > "$RUNNER_TEMP/register-orphan-negative.log" 2>&1; then
            cat "$RUNNER_TEMP/register-orphan-negative.log"
            exit 1
          fi
          cat "$RUNNER_TEMP/register-orphan-negative.log"
          grep -F 'query survived register budget:' "$RUNNER_TEMP/register-orphan-negative.log"
          REGISTER_READ_ORACLE="$RUNNER_TEMP/register-read-oracle.json" REGISTER_READ_ORACLE_WRITE=1 uv run --locked --project plugins/long-running pytest -c .ci-register-orphan-baseline/plugins/long-running/pyproject.toml .ci-register-orphan-baseline/plugins/long-running/tests/test_register_reads.py -q -s -k test_register_read_cli_oracle
          REGISTER_READ_ORACLE="$RUNNER_TEMP/register-read-oracle.json" uv run --locked --project plugins/long-running pytest plugins/long-running/tests/test_register_reads.py -q -s
      - uses: actions/checkout@v7
        if: ${{ always() }}
        with:
          ref: 02347e0d913a966999b0dc794e07071220299105
          path: .ci-baseline
      - name: Measure actual consumers against JSON baseline
        if: ${{ always() }}
        run: uv run --locked --project plugins/long-running python plugins/long-running/benchmarks/paired-production-consumers.py --plugin .ci-baseline/plugins/long-running --format json > "$RUNNER_TEMP/long-running-json-consumers.json"
      - name: Measure actual consumers against SQLite candidate
        if: ${{ always() }}
        run: uv run --locked --project plugins/long-running python plugins/long-running/benchmarks/paired-production-consumers.py --plugin plugins/long-running --format sqlite > "$RUNNER_TEMP/long-running-sqlite-consumers.json"
      - name: Paired actual consumer receipts
        if: ${{ always() }}
        run: |
          cat "$RUNNER_TEMP/long-running-json-consumers.json"
          cat "$RUNNER_TEMP/long-running-sqlite-consumers.json"
      - uses: actions/checkout@v7
        with:
          ref: 35fa995a3f249a26137b9876a42052b7fd86fde7
          path: .ci-unsafe-reexec-baseline
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: 897a7efad74429a246c919bcaf3e91a926736389
          path: .ci-stale-blocker-baseline
          persist-credentials: false
      - name: Immutable stale-blocker machine-reference negative controls
        run: |
          baseline=.ci-stale-blocker-baseline/plugins/long-running
          cp plugins/long-running/tests/test_desk_runner.py "$baseline/tests/test_desk_runner.py"
          for origin in owner remote; do
            negative="$RUNNER_TEMP/stale-blocker-$origin.log"
            if uv run --locked --project "$baseline" pytest "$baseline/tests/test_desk_runner.py::test_stale_blocker_uses_internal_reference_for_mixed_origin_receipt[$origin]" -q >"$negative" 2>&1; then
              cat "$negative"
              echo "stale blocker human-reference baseline unexpectedly passed"
              exit 1
            fi
            cat "$negative"
            grep -F 'stale blocker used human reference for internal sequence' "$negative"
            grep -F '1 failed' "$negative"
          done
      - name: Stale-blocker internal references
        run: uv run --locked --project plugins/long-running pytest plugins/long-running/tests/test_desk_runner.py::test_stale_blocker_uses_internal_reference_for_mixed_origin_receipt -q
      - name: Immutable inherited-child termination negative controls
        run: |
          baseline=.ci-unsafe-reexec-baseline/plugins/long-running
          cp plugins/long-running/tests/test_board_watch.py "$baseline/tests/test_board_watch.py"
          cp plugins/long-running/tests/test_owned_reexec.py "$baseline/tests/test_owned_reexec.py"
          i=0
          for node in "$baseline/tests/test_board_watch.py::test_a_reexecuted_watch_ends_the_streams_its_older_image_started" "$baseline/tests/test_owned_reexec.py::test_reexec_does_not_signal_unregistered_inherited_children"; do
            i=$((i + 1))
            negative="$RUNNER_TEMP/unsafe-inherited-reexec-$i.log"
            if uv run --locked --project "$baseline" pytest "$node" -q >"$negative" 2>&1; then
              cat "$negative"
              echo "unsafe inherited-child implementation unexpectedly passed"
              exit 1
            fi
            cat "$negative"
            grep -F 'inherited protected child was terminated or changed' "$negative"
            grep -F '1 failed' "$negative"
          done
      - name: Owned watch cleanup and protected-child survival
        run: |
          git rev-parse HEAD > "$RUNNER_TEMP/owned-reexec-source.txt"
          sha256sum plugins/long-running/skills/long-running/scripts/board_watch.py plugins/long-running/skills/long-running/scripts/long_running/drive.py >> "$RUNNER_TEMP/owned-reexec-source.txt"
          uv run --locked --project plugins/long-running pytest plugins/long-running/tests/test_owned_reexec.py plugins/long-running/tests/test_board_watch.py plugins/long-running/tests/test_drive.py plugins/long-running/tests/test_ledger_shell.py -q -s --junitxml="$RUNNER_TEMP/owned-reexec.xml"
      - uses: actions/upload-artifact@v7
        with:
          name: owned-reexec-acceptance
          path: |
            ${{ runner.temp }}/owned-reexec-source.txt
            ${{ runner.temp }}/owned-reexec.xml
            ${{ runner.temp }}/unsafe-inherited-reexec-*.log
      - name: Owned rulings caller regressions
        run: uv run --locked --project plugins/long-running pytest plugins/long-running/tests/test_board_text_gate.py plugins/long-running/tests/test_owner_facing.py plugins/long-running/tests/test_register_capture.py plugins/long-running/tests/test_register_gates.py plugins/long-running/tests/test_ruling_judge.py plugins/long-running/tests/test_rulings_consumers.py plugins/long-running/tests/test_rulings_owned_hooks.py plugins/long-running/tests/test_compaction_handoff.py -q -s
      - name: Request-owned judge regressions
        run: uv run --locked --project plugins/long-running pytest plugins/long-running/tests/test_judge_request_owned.py plugins/long-running/tests/test_judge.py plugins/long-running/tests/test_rulings_dispatch.py -q -s
      - name: Owned fifteenth check-pr regressions
        run: uv run --locked --project plugins/long-running pytest plugins/long-running/tests/test_fifteenth_check_pr_owned.py plugins/long-running/tests/test_lane_landing.py -q -s
      - name: capt-hook pack test
        run: uvx --isolated --from 'capt-hook==12.108.4' capt-hook pack test plugins/long-running
      - uses: actions/checkout@v7
        with:
          ref: f37dde3a53da2f13404a3417cbfb611d963f9531
          path: .ci-overflow-route-baseline
      - name: Immutable overflow history and reader-lifetime negative controls
        run: |
          test "$(git -C .ci-overflow-route-baseline rev-parse HEAD)" = f37dde3a53da2f13404a3417cbfb611d963f9531
          uv run --locked --project plugins/long-running pytest -c .ci-overflow-route-baseline/plugins/long-running/pyproject.toml .ci-overflow-route-baseline/plugins/long-running/tests/overflow_read_integration.py -q -s
          cp plugins/long-running/tests/overflow_read_integration.py .ci-overflow-route-baseline/plugins/long-running/tests/overflow_read_integration.py
          for history in 32 10000; do
            negative="$RUNNER_TEMP/overflow-route-negative-$history.log"
            if uv run --locked --project plugins/long-running pytest -c .ci-overflow-route-baseline/plugins/long-running/pyproject.toml ".ci-overflow-route-baseline/plugins/long-running/tests/overflow_read_integration.py::test_actual_overflow_refusal_historical_read_cost[$history]" -q -s > "$negative" 2>&1; then
              cat "$negative"
              exit 1
            fi
            cat "$negative"
            grep -F 'overflow route history decoded' "$negative"
            grep -F '1 failed' "$negative"
          done
          negative="$RUNNER_TEMP/overflow-reader-negative.log"
          if uv run --locked --project plugins/long-running pytest -c .ci-overflow-route-baseline/plugins/long-running/pyproject.toml .ci-overflow-route-baseline/plugins/long-running/tests/overflow_read_integration.py::test_overflow_thread_reuses_readers_sees_writes_and_closes_on_exit -q -s > "$negative" 2>&1; then
            cat "$negative"
            exit 1
          fi
          cat "$negative"
          grep -F 'overflow thread opened' "$negative"
          grep -F '1 failed' "$negative"
      - name: Actual overflow refusal historical read costs
        run: uv run --locked --project plugins/long-running pytest plugins/long-running/tests/overflow_read_integration.py -q -s
      - name: pytest
        run: uv run --locked --project plugins/long-running pytest plugins/long-running/tests -q
      - uses: actions/checkout@v7
        with:
          ref: 1af779ed338cf93945678ad33c396f1546d0fda3
          path: .ci-incident-number-baseline
      - name: Immutable mixed-origin incident citation negative control
        run: |
          test "$(git -C .ci-incident-number-baseline rev-parse HEAD)" = 1af779ed338cf93945678ad33c396f1546d0fda3
          python - <<'PYCODE'
          import ast
          from pathlib import Path
          name = "test_an_open_incident_naming_the_pr_refuses_its_enqueue_naming_the_incident"
          current = Path("plugins/long-running/tests/test_desk_runner.py").read_text()
          baseline = Path(".ci-incident-number-baseline/plugins/long-running/tests/test_desk_runner.py")
          original = baseline.read_text()
          selected = next(node for node in ast.parse(current).body if isinstance(node, ast.FunctionDef) and node.name == name)
          prior = next(node for node in ast.parse(original).body if isinstance(node, ast.FunctionDef) and node.name == name)
          start = lambda node: min([node.lineno, *(decorator.lineno for decorator in node.decorator_list)]) - 1
          lines = original.splitlines(keepends=True)
          for node in ast.walk(selected):
              if isinstance(node, ast.Call) and isinstance(node.func, ast.Name) and node.func.id == "said":
                  node.func.id = "escalations"
          lines[start(prior):prior.end_lineno] = [ast.unparse(selected) + "\n"]
          baseline.write_text("".join(lines))
          PYCODE
          for number in '#7' '#100@bbbbbbbb'; do
            negative="$RUNNER_TEMP/incident-number-negative-$number.log"
            if uv run --locked --project plugins/long-running pytest -c .ci-incident-number-baseline/plugins/long-running/pyproject.toml ".ci-incident-number-baseline/plugins/long-running/tests/test_desk_runner.py::test_an_open_incident_naming_the_pr_refuses_its_enqueue_naming_the_incident[$number]" -q -s > "$negative" 2>&1; then
              cat "$negative"
              exit 1
            fi
            cat "$negative"
            grep -F "origin-qualified incident citation expected $number:" "$negative"
            grep -F '1 failed' "$negative"
          done
      - name: Binary attachment actual mq read costs
        run: |
          git fetch --no-tags --depth=1 origin 74d5367232c1636b21615b38946751852f532dfa
          git show 74d5367232c1636b21615b38946751852f532dfa:plugins/long-running/skills/long-running/scripts/grades.py > "$RUNNER_TEMP/grades-whole-body.py"
          LR_BINARY_BODY_LEGACY_SOURCE="$RUNNER_TEMP/grades-whole-body.py" uv run --locked --project plugins/long-running pytest plugins/long-running/tests/binary_body_integration.py plugins/long-running/tests/test_grades.py -q -s
      - name: bounded controller operation counts
        run: uv run --locked --project plugins/long-running pytest plugins/long-running/tests/test_desk_runner.py -q -s -k 'test_flake_watch_reads_only_remembered_red_builds or test_release_and_cut_polls_decode_only_active_fact_entries'
      - name: historical lane read costs
        run: uv run --locked --project plugins/long-running pytest plugins/long-running/tests/test_desk_runner.py -q -s -k test_orca_historical_lane_read_connection_cost
      - name: indexed build cache actual caller costs
        run: uv run --locked --project plugins/long-running pytest plugins/long-running/tests/test_build_cache.py -q -s
      - uses: actions/checkout@v7
        with:
          ref: 2be0655efb61b8c4d65ecdea9d42b6660c092626
          path: .ci-build-reader-baseline
      - name: Immutable selected build reader baseline and negative control
        run: |
          test "$(git -C .ci-build-reader-baseline rev-parse HEAD)" = 2be0655efb61b8c4d65ecdea9d42b6660c092626
          uv run --locked --project plugins/long-running pytest -c .ci-build-reader-baseline/plugins/long-running/pyproject.toml .ci-build-reader-baseline/plugins/long-running/tests/test_build_cache.py -q -s -k test_actual_landing_selected_cached_build_read_connections
          cp plugins/long-running/tests/test_build_cache.py .ci-build-reader-baseline/plugins/long-running/tests/test_build_cache.py
          for population in 32 10000; do
            negative="$RUNNER_TEMP/build-reader-negative-$population.log"
            if uv run --locked --project plugins/long-running pytest -c .ci-build-reader-baseline/plugins/long-running/pyproject.toml ".ci-build-reader-baseline/plugins/long-running/tests/test_build_cache.py::test_actual_landing_selected_cached_build_read_connections[$population]" -q -s > "$negative" 2>&1; then
              cat "$negative"
              exit 1
            fi
            cat "$negative"
            grep -F 'selected cached builds reopened 32 readers' "$negative"
            grep -F '1 failed' "$negative"
          done
      - name: installed state package
        run: |
          uv build --project plugins/long-running --wheel --out-dir "$RUNNER_TEMP/long-running-wheel"
          uv venv "$RUNNER_TEMP/long-running-venv"
          uv pip install --python "$RUNNER_TEMP/long-running-venv/bin/python" "$RUNNER_TEMP"/long-running-wheel/*.whl
          "$RUNNER_TEMP/long-running-venv/bin/python" -I -m long_running.actions --help
          "$RUNNER_TEMP/long-running-venv/bin/python" -I -c 'from long_running.roster_service import mailbox_of; from long_running.rosters import RosterIndex'
      - name: action-store scaling costs
        if: ${{ always() }}
        run: uv run --locked --project plugins/long-running python plugins/long-running/benchmarks/action-store.py
      - name: Measure production SQLite scaling costs
        if: ${{ always() }}
        run: uv run --locked --project plugins/long-running python plugins/long-running/benchmarks/sqlite-action-store.py
      - name: Confirm JSON baseline behavior for corrected integration regressions
        if: ${{ always() }}
        run: >-
          uv run --locked --project plugins/long-running pytest
          -c .ci-baseline/plugins/long-running/pyproject.toml
          .ci-baseline/plugins/long-running/tests/test_desk_runner.py
          .ci-baseline/plugins/long-running/tests/test_incident.py
          .ci-baseline/plugins/long-running/tests/test_owner_facing.py
          -q -k 'test_a_conflict_beside_a_running_check_routes_once_per_head_without_the_check or test_a_redundant_skip_head_is_proven_by_a_full_run_its_lane_reports_green_on_a_commit_containing_it or test_a_redundant_skip_head_no_tip_build_covers_gets_one_full_build_on_a_grade_branch_and_is_green_once_it_passes or test_a_head_ccx_reads_unproven_gets_its_full_build_and_blocker_without_a_check_and_is_checked_once_proven or test_a_failed_build_is_never_kept_so_a_retried_job_that_passes_reads_green or test_a_full_build_that_does_not_start_escalates_once_per_head_and_is_tried_again or test_a_red_check_drop_its_gate_blocks_waits_for_a_new_head or test_a_launch_the_script_cannot_start_is_refused_when_submitted or test_brief_writes_the_briefs_run_would_launch_and_prints_their_paths or test_an_adopted_lane_is_recorded_not_launched or test_the_record_lives_in_cc_notes_and_briefs_carry_its_ids or test_open_records_the_rulings_and_entry_point_the_fix_brief_quotes or test_a_brief_with_no_rulings_says_so_and_asks_nothing or test_the_fix_brief_names_the_report_time_and_carries_the_standing_orders or test_a_publish_line_during_an_open_incident_quotes_the_released_record or test_plan_mode_warns_while_a_drive_incident_is_open or test_an_owner_question_on_other_work_warns_while_the_alert_is_active or test_a_root_probe_warns_while_the_alert_is_active'
      - name: Compare fact replacement order with JSON baseline
        if: ${{ always() }}
        run: |
          uv run --locked --project plugins/long-running python plugins/long-running/benchmarks/fact-replacement-parity.py --plugin .ci-baseline/plugins/long-running --format json > "$RUNNER_TEMP/long-running-json-fact-order.json"
          uv run --locked --project plugins/long-running python plugins/long-running/benchmarks/fact-replacement-parity.py --plugin plugins/long-running --format sqlite > "$RUNNER_TEMP/long-running-sqlite-fact-order.json"
          diff -u "$RUNNER_TEMP/long-running-json-fact-order.json" "$RUNNER_TEMP/long-running-sqlite-fact-order.json"
          cat "$RUNNER_TEMP/long-running-sqlite-fact-order.json"
      - name: mailbox index scaling costs
        run: uv run --locked --project plugins/long-running python plugins/long-running/benchmarks/mailbox-index.py > mailbox-index-linux.json
      - uses: actions/upload-artifact@v7
        with:
          name: mailbox-index-linux
          path: mailbox-index-linux.json
  native-cci-caller:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.14"
      GOMAXPROCS: "2"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: yasyf/cc-inbox
          ref: 5e61c5bc11d417c601889cac1393b346d17a44cb
          path: .ci-native-cci
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: 457d96c7ecdf67e3eb2d3b0799df9dd79f9f64d1
          path: .ci-cci-legacy
      - uses: actions/setup-go@v6
        with:
          go-version-file: .ci-native-cci/go.mod
          cache-dependency-path: .ci-native-cci/go.sum
      - uses: astral-sh/setup-uv@v8.2.0
      - name: build actual native handler fixture and CLI
        run: |
          mkdir -p .ci-native-cci/cmd/landing-native-fixture "$RUNNER_TEMP/native-cci-bin"
          cp plugins/long-running/tests/fixtures/native_cci/main.go .ci-native-cci/cmd/landing-native-fixture/main.go
          go -C .ci-native-cci build -p 2 -o "$RUNNER_TEMP/native-cci-fixture" ./cmd/landing-native-fixture
          go -C .ci-native-cci build -p 2 -o "$RUNNER_TEMP/native-cci-bin/cci" ./cmd/cci
      - name: actual Landing CCI process counts and freshness
        env:
          CCI_NATIVE_FIXTURE: ${{ runner.temp }}/native-cci-fixture
          CCI_NATIVE_BINARY_DIR: ${{ runner.temp }}/native-cci-bin
          CCI_NATIVE_PROVIDER_SOURCE: 5e61c5bc11d417c601889cac1393b346d17a44cb
          CCI_LEGACY_DESK_RUNNER: ${{ github.workspace }}/.ci-cci-legacy/plugins/long-running/skills/long-running/scripts/desk-runner.py
        run: uv run --locked --project plugins/long-running pytest plugins/long-running/tests/native_cci_integration.py -q -s --junitxml="$RUNNER_TEMP/native-cci.xml"
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: native-cci-caller
          path: ${{ runner.temp }}/native-cci.xml

  incident-index-caller:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.14"
      GOMAXPROCS: "2"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: yasyf/cc-inbox
          ref: 67a9ba0415a718dd7ed61773695da93a8061e7ef
          path: .ci-incident-index
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: .ci-incident-index/go.mod
          cache-dependency-path: .ci-incident-index/go.sum
      - uses: astral-sh/setup-uv@v8.2.0
      - name: Build actual indexed incident handler fixture
        run: |
          test "$(git -C .ci-incident-index rev-parse HEAD)" = 67a9ba0415a718dd7ed61773695da93a8061e7ef
          mkdir -p .ci-incident-index/cmd/landing-incident-fixture
          cp plugins/long-running/tests/fixtures/incident_index/main.go .ci-incident-index/cmd/landing-incident-fixture/main.go
          go -C .ci-incident-index build -p 2 -o "$RUNNER_TEMP/incident-index-fixture" ./cmd/landing-incident-fixture
      - name: Actual Landing indexed incident selection and mutable-file freshness
        env:
          CCI_INCIDENT_FIXTURE: ${{ runner.temp }}/incident-index-fixture
          CCI_INCIDENT_PROVIDER_SOURCE: 67a9ba0415a718dd7ed61773695da93a8061e7ef
        run: uv run --locked --project plugins/long-running pytest plugins/long-running/tests/incident_index_integration.py -q -s --junitxml="$RUNNER_TEMP/incident-index.xml"
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: incident-index-caller
          path: ${{ runner.temp }}/incident-index.xml

  machine-cci-post:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.14"
      GOMAXPROCS: "2"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: yasyf/cc-inbox
          ref: 9f5cfdf4dc61bde964713bea7d47ffab928e7afc
          path: .ci-machine-cci
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: b1f48b3c9e38ee2b4851f3d1b5f6e58c38125c02
          path: .ci-post-legacy
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: .ci-machine-cci/go.mod
          cache-dependency-path: .ci-machine-cci/go.sum
      - uses: astral-sh/setup-uv@v8.2.0
      - name: build actual machine-reference CLI
        working-directory: .ci-machine-cci
        run: |
          mkdir -p "$RUNNER_TEMP/machine-cci"
          go build -p 2 -o "$RUNNER_TEMP/machine-cci/cci" ./cmd/cci
      - name: actual LR machine post receipts and references
        env:
          CCI_MACHINE_BINARY_DIR: ${{ runner.temp }}/machine-cci
          CCI_MACHINE_PROVIDER_SOURCE: 9f5cfdf4dc61bde964713bea7d47ffab928e7afc
          CCI_MACHINE_LEGACY_RUNNER: ${{ github.workspace }}/.ci-post-legacy/plugins/long-running/skills/long-running/scripts/desk-runner.py
        run: uv run --locked --project plugins/long-running pytest plugins/long-running/tests/machine_post_integration.py -q -s --junitxml=machine-cci-post.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: machine-cci-post
          path: machine-cci-post.xml
