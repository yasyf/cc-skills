name: long-running CI

on:
  push:
    branches: [main]
    paths:
      - "plugins/long-running/**"
      - ".github/workflows/long-running-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "plugins/long-running/**"
      - ".github/workflows/long-running-ci.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pip install pytest "spawnllm>=0.17.7"
      - name: pytest
        run: python -m pytest plugins/long-running/tests -q
      - uses: astral-sh/setup-uv@v8.2.0
      - name: capt-hook pack test
        env:
          UV_PYTHON: "3.14"
          LONG_RUNNING_STATE: ${{ github.workspace }}/plugins/long-running/capt-hook/hooks/tests/fixtures/state
        run: uvx --isolated 'capt-hook>=12.121.70' pack test plugins/long-running
