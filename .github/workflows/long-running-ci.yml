name: long-running CI

on:
  push:
    branches: [main]
    paths:
      - "plugins/long-running/**"
      - ".github/workflows/long-running-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "plugins/long-running/**"
      - ".github/workflows/long-running-ci.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pytest
      - name: pytest
        run: python -m pytest plugins/long-running/tests -q
