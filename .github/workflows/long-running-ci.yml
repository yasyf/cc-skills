name: long-running CI

on:
  push:
    paths:
      - "plugins/long-running/**"
      - "plugins/live-dashboard/skills/live-dashboard/scripts/**"
      - ".github/workflows/long-running-ci.yml"
  pull_request:
    paths:
      - "plugins/long-running/**"
      - "plugins/live-dashboard/skills/live-dashboard/scripts/**"
      - ".github/workflows/long-running-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # TODO: drop once isal, thinc, and ast-grep-py ship CPython 3.15 wheels; uv 0.13.0 defaults to 3.15 and their source builds fail.
      UV_PYTHON: "3.14"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.2.0
      - name: pytest
        run: uv run --project plugins/long-running pytest plugins/long-running/tests -q
      - name: capt-hook pack test
        run: uvx --isolated 'capt-hook>=12.103.1' pack test plugins/long-running
      - name: installed state package
        run: |
          uv build --project plugins/long-running --wheel --out-dir "$RUNNER_TEMP/long-running-wheel"
          uv venv "$RUNNER_TEMP/long-running-venv"
          uv pip install --python "$RUNNER_TEMP/long-running-venv/bin/python" "$RUNNER_TEMP"/long-running-wheel/*.whl
          "$RUNNER_TEMP/long-running-venv/bin/python" -I -m long_running.actions --help
      - name: action-store scaling costs
        run: uv run --project plugins/long-running python plugins/long-running/benchmarks/action-store.py
