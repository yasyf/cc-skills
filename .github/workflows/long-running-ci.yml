name: long-running CI

on:
  push:
    branches: [main]
    paths:
      - "plugins/long-running/**"
      - "plugins/live-dashboard/skills/live-dashboard/scripts/**"
      - ".github/workflows/long-running-ci.yml"
  pull_request:
    paths:
      - "plugins/long-running/**"
      - "plugins/live-dashboard/skills/live-dashboard/scripts/**"
      - ".github/workflows/long-running-ci.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # TODO: drop once isal, thinc, and ast-grep-py ship CPython 3.15 wheels; uv 0.13.0 defaults to 3.15 and their source builds fail.
      UV_PYTHON: "3.14"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.2.0
      - uses: actions/checkout@v7
        with:
          ref: 963e964f15a919b6f0588fba2d7dd68de41c4d91
          path: .ci-register-orphan-baseline
      - name: Immutable register query orphan reproduction and CLI oracle
        run: |
          test "$(git -C .ci-register-orphan-baseline rev-parse HEAD)" = 963e964f15a919b6f0588fba2d7dd68de41c4d91
          cp plugins/long-running/tests/test_register_reads.py .ci-register-orphan-baseline/plugins/long-running/tests/
          if uv run --locked --project plugins/long-running pytest -c .ci-register-orphan-baseline/plugins/long-running/pyproject.toml .ci-register-orphan-baseline/plugins/long-running/tests/test_register_reads.py -q -s -k test_register_query_timeout_leaves_no_child > "$RUNNER_TEMP/register-orphan-negative.log" 2>&1; then
            cat "$RUNNER_TEMP/register-orphan-negative.log"
            exit 1
          fi
          cat "$RUNNER_TEMP/register-orphan-negative.log"
          grep -F 'query survived register budget:' "$RUNNER_TEMP/register-orphan-negative.log"
          REGISTER_READ_ORACLE="$RUNNER_TEMP/register-read-oracle.json" REGISTER_READ_ORACLE_WRITE=1 uv run --locked --project plugins/long-running pytest -c .ci-register-orphan-baseline/plugins/long-running/pyproject.toml .ci-register-orphan-baseline/plugins/long-running/tests/test_register_reads.py -q -s -k test_register_read_cli_oracle
          REGISTER_READ_ORACLE="$RUNNER_TEMP/register-read-oracle.json" uv run --locked --project plugins/long-running pytest plugins/long-running/tests/test_register_reads.py -q -s
      - name: pytest
        run: uv run --locked --project plugins/long-running pytest plugins/long-running/tests -q
      - name: Binary attachment actual mq read costs
        run: |
          git fetch --no-tags --depth=1 origin 74d5367232c1636b21615b38946751852f532dfa
          git show 74d5367232c1636b21615b38946751852f532dfa:plugins/long-running/skills/long-running/scripts/grades.py > "$RUNNER_TEMP/grades-whole-body.py"
          LR_BINARY_BODY_LEGACY_SOURCE="$RUNNER_TEMP/grades-whole-body.py" uv run --locked --project plugins/long-running pytest plugins/long-running/tests/binary_body_integration.py plugins/long-running/tests/test_grades.py -q -s
      - name: bounded controller operation counts
        run: uv run --locked --project plugins/long-running pytest plugins/long-running/tests/test_desk_runner.py -q -s -k 'test_flake_watch_reads_only_remembered_red_builds or test_release_and_cut_polls_decode_only_active_fact_entries'
      - name: historical lane read costs
        run: uv run --locked --project plugins/long-running pytest plugins/long-running/tests/test_desk_runner.py -q -s -k test_orca_historical_lane_read_connection_cost
      - name: capt-hook pack test
        run: uvx --isolated 'capt-hook>=12.107.13' pack test plugins/long-running
      - name: installed state package
        run: |
          uv build --project plugins/long-running --wheel --out-dir "$RUNNER_TEMP/long-running-wheel"
          uv venv "$RUNNER_TEMP/long-running-venv"
          uv pip install --python "$RUNNER_TEMP/long-running-venv/bin/python" "$RUNNER_TEMP"/long-running-wheel/*.whl
          "$RUNNER_TEMP/long-running-venv/bin/python" -I -m long_running.actions --help
          "$RUNNER_TEMP/long-running-venv/bin/python" -I -c 'from long_running.roster_service import mailbox_of; from long_running.rosters import RosterIndex'
      - name: action-store scaling costs
        if: ${{ always() }}
        run: uv run --locked --project plugins/long-running python plugins/long-running/benchmarks/action-store.py
      - name: Measure production SQLite scaling costs
        if: ${{ always() }}
        run: uv run --locked --project plugins/long-running python plugins/long-running/benchmarks/sqlite-action-store.py
      - uses: actions/checkout@v7
        if: ${{ always() }}
        with:
          ref: 02347e0d913a966999b0dc794e07071220299105
          path: .ci-baseline
      - name: Confirm JSON baseline behavior for corrected integration regressions
        if: ${{ always() }}
        run: >-
          uv run --locked --project plugins/long-running pytest
          -c .ci-baseline/plugins/long-running/pyproject.toml
          .ci-baseline/plugins/long-running/tests/test_desk_runner.py
          .ci-baseline/plugins/long-running/tests/test_incident.py
          .ci-baseline/plugins/long-running/tests/test_owner_facing.py
          -q -k 'test_a_conflict_beside_a_running_check_routes_once_per_head_without_the_check or test_a_redundant_skip_head_is_proven_by_a_full_run_its_lane_reports_green_on_a_commit_containing_it or test_a_redundant_skip_head_no_tip_build_covers_gets_one_full_build_on_a_grade_branch_and_is_green_once_it_passes or test_a_head_ccx_reads_unproven_gets_its_full_build_and_blocker_without_a_check_and_is_checked_once_proven or test_a_failed_build_is_never_kept_so_a_retried_job_that_passes_reads_green or test_a_full_build_that_does_not_start_escalates_once_per_head_and_is_tried_again or test_a_red_check_drop_its_gate_blocks_waits_for_a_new_head or test_a_launch_the_script_cannot_start_is_refused_when_submitted or test_brief_writes_the_briefs_run_would_launch_and_prints_their_paths or test_an_adopted_lane_is_recorded_not_launched or test_the_record_lives_in_cc_notes_and_briefs_carry_its_ids or test_open_records_the_rulings_and_entry_point_the_fix_brief_quotes or test_a_brief_with_no_rulings_says_so_and_asks_nothing or test_the_fix_brief_names_the_report_time_and_carries_the_standing_orders or test_a_publish_line_during_an_open_incident_quotes_the_released_record or test_plan_mode_warns_while_a_drive_incident_is_open or test_an_owner_question_on_other_work_warns_while_the_alert_is_active or test_a_root_probe_warns_while_the_alert_is_active'
      - name: Compare fact replacement order with JSON baseline
        if: ${{ always() }}
        run: |
          uv run --locked --project plugins/long-running python plugins/long-running/benchmarks/fact-replacement-parity.py --plugin .ci-baseline/plugins/long-running --format json > "$RUNNER_TEMP/long-running-json-fact-order.json"
          uv run --locked --project plugins/long-running python plugins/long-running/benchmarks/fact-replacement-parity.py --plugin plugins/long-running --format sqlite > "$RUNNER_TEMP/long-running-sqlite-fact-order.json"
          diff -u "$RUNNER_TEMP/long-running-json-fact-order.json" "$RUNNER_TEMP/long-running-sqlite-fact-order.json"
          cat "$RUNNER_TEMP/long-running-sqlite-fact-order.json"
      - name: Measure actual consumers against JSON baseline
        if: ${{ always() }}
        run: uv run --locked --project plugins/long-running python plugins/long-running/benchmarks/paired-production-consumers.py --plugin .ci-baseline/plugins/long-running --format json > "$RUNNER_TEMP/long-running-json-consumers.json"
      - name: Measure actual consumers against SQLite candidate
        if: ${{ always() }}
        run: uv run --locked --project plugins/long-running python plugins/long-running/benchmarks/paired-production-consumers.py --plugin plugins/long-running --format sqlite > "$RUNNER_TEMP/long-running-sqlite-consumers.json"
      - name: Paired actual consumer receipts
        if: ${{ always() }}
        run: |
          cat "$RUNNER_TEMP/long-running-json-consumers.json"
          cat "$RUNNER_TEMP/long-running-sqlite-consumers.json"
      - name: mailbox index scaling costs
        run: uv run --locked --project plugins/long-running python plugins/long-running/benchmarks/mailbox-index.py > mailbox-index-linux.json
      - uses: actions/upload-artifact@v7
        with:
          name: mailbox-index-linux
          path: mailbox-index-linux.json
  native-cci-caller:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.14"
      GOMAXPROCS: "2"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: yasyf/cc-inbox
          ref: 2343fc6a5f208ba975fbaf2f960253b8d9352000
          path: .ci-native-cci
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: 457d96c7ecdf67e3eb2d3b0799df9dd79f9f64d1
          path: .ci-cci-legacy
      - uses: actions/setup-go@v6
        with:
          go-version-file: .ci-native-cci/go.mod
          cache-dependency-path: .ci-native-cci/go.sum
      - uses: astral-sh/setup-uv@v8.2.0
      - name: build actual native handler fixture and CLI
        run: |
          mkdir -p .ci-native-cci/cmd/landing-native-fixture "$RUNNER_TEMP/native-cci-bin"
          cp plugins/long-running/tests/fixtures/native_cci/main.go .ci-native-cci/cmd/landing-native-fixture/main.go
          go -C .ci-native-cci build -p 2 -o "$RUNNER_TEMP/native-cci-fixture" ./cmd/landing-native-fixture
          go -C .ci-native-cci build -p 2 -o "$RUNNER_TEMP/native-cci-bin/cci" ./cmd/cci
      - name: actual Landing CCI process counts and freshness
        env:
          CCI_NATIVE_FIXTURE: ${{ runner.temp }}/native-cci-fixture
          CCI_NATIVE_BINARY_DIR: ${{ runner.temp }}/native-cci-bin
          CCI_NATIVE_PROVIDER_SOURCE: 2343fc6a5f208ba975fbaf2f960253b8d9352000
          CCI_LEGACY_DESK_RUNNER: ${{ github.workspace }}/.ci-cci-legacy/plugins/long-running/skills/long-running/scripts/desk-runner.py
        run: uv run --locked --project plugins/long-running pytest plugins/long-running/tests/native_cci_integration.py -q -s --junitxml="$RUNNER_TEMP/native-cci.xml"
      - uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: native-cci-caller
          path: ${{ runner.temp }}/native-cci.xml

  machine-cci-post:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.14"
      GOMAXPROCS: "2"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: yasyf/cc-inbox
          ref: 9f5cfdf4dc61bde964713bea7d47ffab928e7afc
          path: .ci-machine-cci
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: b1f48b3c9e38ee2b4851f3d1b5f6e58c38125c02
          path: .ci-post-legacy
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: .ci-machine-cci/go.mod
          cache-dependency-path: .ci-machine-cci/go.sum
      - uses: astral-sh/setup-uv@v8.2.0
      - name: build actual machine-reference CLI
        working-directory: .ci-machine-cci
        run: |
          mkdir -p "$RUNNER_TEMP/machine-cci"
          go build -p 2 -o "$RUNNER_TEMP/machine-cci/cci" ./cmd/cci
      - name: actual LR machine post receipts and references
        env:
          CCI_MACHINE_BINARY_DIR: ${{ runner.temp }}/machine-cci
          CCI_MACHINE_PROVIDER_SOURCE: 9f5cfdf4dc61bde964713bea7d47ffab928e7afc
          CCI_MACHINE_LEGACY_RUNNER: ${{ github.workspace }}/.ci-post-legacy/plugins/long-running/skills/long-running/scripts/desk-runner.py
        run: uv run --locked --project plugins/long-running pytest plugins/long-running/tests/machine_post_integration.py -q -s --junitxml=machine-cci-post.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: machine-cci-post
          path: machine-cci-post.xml

  mailbox-macos:
    runs-on: macos-latest
    env:
      UV_PYTHON: "3.14"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.2.0
      - name: native mailbox freshness and lifecycle
        run: uv run --locked --project plugins/long-running pytest plugins/long-running/tests/test_rosters.py plugins/long-running/tests/test_inboxes.py plugins/long-running/tests/test_register_reads.py -q
      - name: mailbox index scaling costs
        run: uv run --locked --project plugins/long-running python plugins/long-running/benchmarks/mailbox-index.py > mailbox-index-macos.json
      - uses: actions/upload-artifact@v7
        with:
          name: mailbox-index-macos
          path: mailbox-index-macos.json
