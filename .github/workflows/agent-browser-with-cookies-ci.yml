name: agent-browser-with-cookies CI

on:
  push:
    paths:
      - "plugins/agent-browser-with-cookies/**"
      - ".github/workflows/agent-browser-with-cookies-ci.yml"
  pull_request:
    paths:
      - "plugins/agent-browser-with-cookies/**"
      - ".github/workflows/agent-browser-with-cookies-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # TODO: drop once this job runs green on CPython 3.15; uv 0.13.0 defaults to 3.15.
      UV_PYTHON: "3.14"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.2.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: pytest
        run: uvx pytest plugins/agent-browser-with-cookies/tests -q
