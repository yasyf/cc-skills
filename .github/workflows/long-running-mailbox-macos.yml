name: long-running mailbox macOS

on:
  push:
    branches: [main]
    tags: ["long-running--v*", "live-dashboard--v*"]
    paths:
      - "plugins/long-running/**"
      - "plugins/live-dashboard/skills/live-dashboard/scripts/**"
      - ".github/workflows/long-running-mailbox-macos.yml"
  pull_request:
    paths:
      - "plugins/long-running/skills/long-running/scripts/long_running/roster_events.py"
      - "plugins/long-running/skills/long-running/scripts/long_running/roster_service.py"
      - "plugins/long-running/skills/long-running/scripts/long_running/rosters.py"
      - "plugins/long-running/skills/long-running/scripts/long_running/register_reads.py"
      - "plugins/long-running/skills/long-running/scripts/long_running/ruling_documents.py"
      - "plugins/long-running/skills/long-running/scripts/long_running/rulings.py"
      - "plugins/long-running/tests/test_ruling_binary_reader.py"
      - "plugins/long-running/skills/long-running/scripts/desk-wait.sh"
      - "plugins/long-running/bin/desk-wait.sh"
      - "plugins/long-running/skills/long-running/scripts/ledger.py"
      - "plugins/long-running/skills/long-running/scripts/drive.py"
      - "plugins/long-running/skills/long-running/scripts/stall_watch.py"
      - "plugins/long-running/skills/long-running/scripts/desk-runner.py"
      - "plugins/long-running/skills/long-running/scripts/cci.py"
      - "plugins/long-running/capt-hook/hooks/compaction_handoff.py"
      - "plugins/long-running/skills/long-running/scripts/long_running/build_cache.py"
      - "plugins/long-running/tests/test_ledger_shell.py"
      - "plugins/long-running/tests/test_stall_watch.py"
      - "plugins/long-running/tests/test_build_cache.py"
      - "plugins/long-running/tests/overflow_read_integration.py"
      - "plugins/long-running/tests/test_rosters.py"
      - "plugins/long-running/tests/test_inboxes.py"
      - "plugins/long-running/tests/test_register_reads.py"
      - "plugins/long-running/benchmarks/mailbox-index.py"
      - ".github/workflows/long-running-mailbox-macos.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mailbox-macos:
    runs-on: macos-latest
    env:
      UV_PYTHON: "3.14"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.2.0
      - uses: actions/checkout@v7
        with:
          ref: 9d930510a7643fedb6d756055bfc2872979e2c9c
          path: .ci-executor-reader-baseline
          persist-credentials: false
      - name: Immutable executor reader lifetime negative controls
        run: |
          baseline=.ci-executor-reader-baseline/plugins/long-running
          cp plugins/long-running/tests/test_executor_incident_readers.py "$baseline/tests/test_executor_incident_readers.py"
          for history in 32 256; do
            negative="$RUNNER_TEMP/executor-readers-$history-negative.log"
            if uv run --locked --project "$baseline" pytest -c "$baseline/pyproject.toml" "$baseline/tests/test_executor_incident_readers.py::test_executor_scan_reuses_each_incident_reader[$history]" -q -s >"$negative" 2>&1; then
              cat "$negative"
              exit 1
            fi
            cat "$negative"
            grep -F "executor scan opened $((2 * history)) readers for $history incidents" "$negative"
            grep -F '1 failed' "$negative"
          done
      - name: Executor reader lifetime and old-writer visibility
        run: uv run --locked --project plugins/long-running pytest plugins/long-running/tests/test_executor_incident_readers.py -q -s
      - uses: actions/checkout@v7
        with:
          ref: 0beb1c60553e7992068845a822ec42921baf05fe
          path: .ci-restack-history-baseline
          persist-credentials: false
      - name: Immutable restack history negative controls
        run: |
          baseline=.ci-restack-history-baseline/plugins/long-running
          test "$(git -C .ci-restack-history-baseline rev-parse HEAD)" = 0beb1c60553e7992068845a822ec42921baf05fe
          cp plugins/long-running/tests/test_restack_read_cost.py "$baseline/tests/test_restack_read_cost.py"
          for history in 32 10000; do
            negative="$RUNNER_TEMP/restack-history-$history-negative.log"
            if uv run --locked --project plugins/long-running pytest -c "$baseline/pyproject.toml" "$baseline/tests/test_restack_read_cost.py::test_restack_verification_avoids_terminal_history[$history]" -q -s > "$negative" 2>&1; then
              cat "$negative"
              exit 1
            fi
            cat "$negative"
            grep -F "1 failed" "$negative"
            grep -F "actions instead of 4 active candidates" "$negative"
          done
      - name: Active restack selection parity and fixed history cost
        run: uv run --locked --project plugins/long-running pytest plugins/long-running/tests/test_restack_read_cost.py -q -s
      - uses: actions/checkout@v7
        with:
          ref: c729f3d928531710b7cdc0b5137c099058a01460
          path: .ci-ruling-binary-baseline
          persist-credentials: false
      - name: Immutable ruling binary prefix negative controls
        run: |
          test "$(git -C .ci-ruling-binary-baseline rev-parse HEAD)" = c729f3d928531710b7cdc0b5137c099058a01460
          baseline=.ci-ruling-binary-baseline/plugins/long-running
          cp plugins/long-running/tests/test_ruling_binary_reader.py "$baseline/tests/test_ruling_binary_reader.py"
          for caller in reader index readback classify; do
            case "$caller" in
              reader) node=test_ruling_reader_binary_prefix ;;
              index) node=test_document_index_binary_prefix ;;
              readback) node=test_readback_sweeper_binary_prefix ;;
              classify) node=test_classify_sweeper_binary_prefix ;;
            esac
            negative="$RUNNER_TEMP/ruling-binary-$caller-negative.log"
            if uv run --locked --project plugins/long-running pytest -c "$baseline/pyproject.toml" "$baseline/tests/test_ruling_binary_reader.py::$node[large]" -q -s > "$negative" 2>&1; then
              cat "$negative"
              exit 1
            fi
            cat "$negative"
            grep -F "binary ruling $caller read" "$negative"
            grep -F '1 failed' "$negative"
          done
      - name: Ruling binary prefix bytes and text parity
        run: uv run --locked --project plugins/long-running pytest plugins/long-running/tests/test_ruling_binary_reader.py plugins/long-running/tests/test_rulings.py::test_classify_reads_each_unchanged_document_once_for_all_rows -q -s
      - uses: actions/checkout@v7
        with:
          ref: 021af5b6f12e50e35016e74ebe9d0ea02998c903
          path: .ci-selected-status-baseline
          persist-credentials: false
      - name: Immutable externally closed blocker transport negative controls
        run: |
          baseline=.ci-selected-status-baseline/plugins/long-running
          cp plugins/long-running/tests/test_desk_runner.py "$baseline/tests/test_desk_runner.py"
          for state in closed expired; do
            negative="$RUNNER_TEMP/selected-status-$state-negative.log"
            if uv run --locked --project plugins/long-running pytest -c "$baseline/pyproject.toml" "$baseline/tests/test_desk_runner.py::test_stale_blocker_current_closure_keeps_original_receipt_without_reposting[$state]" -q > "$negative" 2>&1; then
              cat "$negative"
              exit 1
            fi
            cat "$negative"
            grep -F 'selected status did not retire externally closed blocker' "$negative"
            grep -F '1 failed' "$negative"
          done
      - name: Selected status transport without a local schema change
        run: |
          uv run --locked --project plugins/long-running pytest plugins/long-running/tests/test_cci_selected_records.py -q
          uv run --locked --project plugins/long-running pytest plugins/long-running/tests/test_desk_runner.py -k stale_blocker -q
      - name: native mailbox freshness and lifecycle, and the shells' command reaping
        run: uv run --locked --project plugins/long-running pytest plugins/long-running/tests/test_rosters.py plugins/long-running/tests/test_inboxes.py plugins/long-running/tests/test_register_reads.py plugins/long-running/tests/test_ledger_shell.py plugins/long-running/tests/test_stall_watch.py plugins/long-running/tests/test_build_cache.py plugins/long-running/tests/overflow_read_integration.py plugins/long-running/tests/test_rulings_dispatch.py plugins/long-running/tests/test_rulings_owned_hooks.py plugins/long-running/tests/test_rulings_consumers.py plugins/long-running/tests/test_lane_landing.py plugins/long-running/tests/test_judge_request_owned.py plugins/long-running/tests/test_judge.py plugins/long-running/tests/test_fifteenth_check_pr_owned.py plugins/long-running/tests/test_owned_reexec.py plugins/long-running/tests/test_board_watch.py::test_a_reexecuted_watch_ends_the_streams_its_older_image_started -q -s
      - name: Actual completed-bus cleanup history costs
        run: uv run --locked --project plugins/long-running pytest plugins/long-running/tests/test_desk_runner.py::test_stale_blocker_cleanup_has_history_bounded_noop_work -q -s
      - uses: actions/checkout@v7
        with:
          ref: 897a7efad74429a246c919bcaf3e91a926736389
          path: .ci-stale-blocker-baseline
          persist-credentials: false
      - name: Unforced blocker index costs and indexless semantics
        run: |
          uv run --locked --project plugins/long-running pytest plugins/long-running/tests/test_blocker_candidates.py::test_actual_unforced_reader_uses_partial_index_with_bounded_work -q -s
          uv run --locked --project plugins/long-running pytest plugins/long-running/tests/test_blocker_candidates.py -q -s
          LR_BLOCKER_OLD_SCRIPTS="$GITHUB_WORKSPACE/.ci-stale-blocker-baseline/plugins/long-running/skills/long-running/scripts" uv run --locked --project plugins/long-running pytest plugins/long-running/tests/blocker_index_old_writer_integration.py -q -s
      - name: Stale-blocker internal references
        run: uv run --locked --project plugins/long-running pytest plugins/long-running/tests/test_desk_runner.py::test_stale_blocker_uses_internal_reference_for_mixed_origin_receipt -q
      - name: mailbox index scaling costs
        run: uv run --locked --project plugins/long-running python plugins/long-running/benchmarks/mailbox-index.py > mailbox-index-macos.json
      - uses: actions/upload-artifact@v7
        with:
          name: mailbox-index-macos
          path: mailbox-index-macos.json
