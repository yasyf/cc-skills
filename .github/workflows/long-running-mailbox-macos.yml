name: long-running mailbox macOS

on:
  push:
    branches: [main]
    tags: ["long-running--v*", "live-dashboard--v*"]
    paths:
      - "plugins/long-running/**"
      - "plugins/live-dashboard/skills/live-dashboard/scripts/**"
      - ".github/workflows/long-running-mailbox-macos.yml"
  pull_request:
    paths:
      - "plugins/long-running/skills/long-running/scripts/long_running/roster_events.py"
      - "plugins/long-running/skills/long-running/scripts/long_running/roster_service.py"
      - "plugins/long-running/skills/long-running/scripts/long_running/rosters.py"
      - "plugins/long-running/skills/long-running/scripts/long_running/register_reads.py"
      - "plugins/long-running/skills/long-running/scripts/long_running/ruling_documents.py"
      - "plugins/long-running/skills/long-running/scripts/long_running/rulings.py"
      - "plugins/long-running/tests/test_ruling_binary_reader.py"
      - "plugins/long-running/skills/long-running/scripts/long_running/sqlite_store.py"
      - "plugins/long-running/tests/test_reader_working_set.py"
      - "plugins/long-running/tests/test_sqlite_action_store.py"
      - "plugins/long-running/tests/test_reader_validation_snapshot.py"
      - "plugins/long-running/tests/test_admission_direct_merge_cost.py"
      - "plugins/long-running/tests/test_merge_wait_fact_cost.py"
      - "plugins/long-running/tests/merge_waits_old_writer_integration.py"
      - "plugins/long-running/tests/direct_merge_old_writer_integration.py"
      - "plugins/long-running/tests/test_release_cursor_noop.py"
      - "plugins/long-running/tests/test_open_cut_clock_noop.py"
      - "plugins/long-running/tests/test_cut_release_read_proof.py"
      - "plugins/long-running/tests/landing_release_history_characterization.py"
      - "plugins/long-running/tests/test_landing_release_generations.py"
      - "plugins/long-running/tests/test_release_action_versions.py"
      - "plugins/long-running/tests/release_generation_old_writer_integration.py"
      - "plugins/long-running/tests/test_read_snapshot_version.py"
      - "plugins/long-running/tests/test_refusal_history_invocation.py"
      - "plugins/long-running/tests/release_proof_old_writer_integration.py"
      - "plugins/long-running/skills/long-running/scripts/desk-wait.sh"
      - "plugins/long-running/bin/desk-wait.sh"
      - "plugins/long-running/skills/long-running/scripts/ledger.py"
      - "plugins/long-running/skills/long-running/scripts/drive.py"
      - "plugins/long-running/skills/long-running/scripts/stall_watch.py"
      - "plugins/long-running/skills/long-running/scripts/desk-runner.py"
      - "plugins/long-running/skills/long-running/scripts/cci.py"
      - "plugins/long-running/capt-hook/hooks/compaction_handoff.py"
      - "plugins/long-running/skills/long-running/scripts/long_running/build_cache.py"
      - "plugins/long-running/tests/test_ledger_shell.py"
      - "plugins/long-running/tests/test_stall_watch.py"
      - "plugins/long-running/tests/test_build_cache.py"
      - "plugins/long-running/tests/overflow_read_integration.py"
      - "plugins/long-running/tests/test_rosters.py"
      - "plugins/long-running/tests/test_inboxes.py"
      - "plugins/long-running/tests/test_register_reads.py"
      - "plugins/long-running/benchmarks/mailbox-index.py"
      - ".github/workflows/long-running-mailbox-macos.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mailbox-macos:
    runs-on: macos-latest
    env:
      UV_PYTHON: "3.14"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.2.0
      - uses: actions/checkout@v7
        with:
          ref: 3a0cf42c873087b50698fcdd43cd9856413ec6f5
          path: .ci-refusal-history-baseline
          persist-credentials: false
      - name: Immutable812 repeated refusal DTO negative controls
        shell: bash
        run: |
          baseline=.ci-refusal-history-baseline/plugins/long-running
          test "$(git -C .ci-refusal-history-baseline rev-parse HEAD)" = 3a0cf42c873087b50698fcdd43cd9856413ec6f5
          cp plugins/long-running/tests/test_refusal_history_invocation.py "$baseline/tests/test_refusal_history_invocation.py"
          for history in 32 10000; do
            negative="$RUNNER_TEMP/refusal-history-old-$history.log"
            if uv run --locked --project "$baseline" pytest -c "$baseline/pyproject.toml" "$baseline/tests/test_refusal_history_invocation.py::test_unchanged_bus_history_is_loaded_once_per_invocation[$history]" -q -s >"$negative" 2>&1; then
              cat "$negative"
              exit 1
            else
              test "$?" -eq 1
            fi
            cat "$negative"
            grep -F "refusal history materialized $((32 * history)) DTOs; expected $history for 32 eligible PRs" "$negative"
            grep -F '1 failed' "$negative"
          done
      - name: Refusal invocation snapshot freshness parity and costs
        shell: bash
        run: uv run --locked --project plugins/long-running pytest plugins/long-running/tests/test_refusal_history_invocation.py plugins/long-running/tests/test_read_snapshot_version.py -q -s --junitxml="$RUNNER_TEMP/refusal-history-current.xml" | tee "$RUNNER_TEMP/refusal-history-current.log"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: refusal-history-${{ runner.os }}
          path: ${{ runner.temp }}/refusal-history-*
          if-no-files-found: error
      - uses: actions/checkout@v7
        with:
          ref: c01c7aa04559b07ad03983301609163b0a4630d0
          path: .ci-release-generation-baseline
          persist-credentials: false
      - name: Immutable801 release-side history negatives
        shell: bash
        run: |
          baseline=.ci-release-generation-baseline/plugins/long-running
          test "$(git -C .ci-release-generation-baseline rev-parse HEAD)" = c01c7aa04559b07ad03983301609163b0a4630d0
          cp plugins/long-running/tests/landing_release_history_characterization.py "$baseline/tests/landing_release_history_characterization.py"
          cp plugins/long-running/tests/test_landing_release_generations.py "$baseline/tests/test_landing_release_generations.py"
          for history in 32 10000; do
            negative="$RUNNER_TEMP/release-generation-old-$history.log"
            if uv run --locked --project "$baseline" pytest -c "$baseline/pyproject.toml" "$baseline/tests/test_landing_release_generations.py::test_warm_release_batches_decode_only_changed_and_active[history-$history-facts-four]" -q -s >"$negative" 2>&1; then
              cat "$negative"
              exit 1
            fi
            cat "$negative"
            grep -F "warm release-side batches materialized $((32 * (history + 3))) DTOs for $history retired actions in 32 polls" "$negative"
            grep -F '1 failed' "$negative"
          done
      - name: Native release generations and actual caller costs
        shell: bash
        run: uv run --locked --project plugins/long-running pytest plugins/long-running/tests/test_landing_release_generations.py plugins/long-running/tests/test_release_action_versions.py plugins/long-running/tests/test_sqlite_action_store.py -q -s --junitxml="$RUNNER_TEMP/release-generation-current.xml" | tee "$RUNNER_TEMP/release-generation-current.log"
      - name: Immutable801 release writer and explicit old-creator provision
        shell: bash
        env:
          LR_BLOCKER_OLD_SCRIPTS: ${{ github.workspace }}/.ci-release-generation-baseline/plugins/long-running/skills/long-running/scripts
        run: uv run --locked --project plugins/long-running pytest plugins/long-running/tests/release_generation_old_writer_integration.py -q -s --junitxml="$RUNNER_TEMP/release-generation-old-writer.xml" | tee "$RUNNER_TEMP/release-generation-old-writer.log"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-generation-${{ runner.os }}
          path: ${{ runner.temp }}/release-generation-*
          if-no-files-found: error
      - uses: actions/checkout@v7
        with:
          ref: 82ab4e455cca7584000efc44439d74bb15f4b6b0
          path: .ci-release-proof-baseline
          persist-credentials: false
      - name: Immutable repeated release materialization negative controls
        shell: bash
        run: |
          baseline=.ci-release-proof-baseline/plugins/long-running
          test "$(git -C .ci-release-proof-baseline rev-parse HEAD)" = 82ab4e455cca7584000efc44439d74bb15f4b6b0
          cp plugins/long-running/tests/test_cut_release_read_proof.py "$baseline/tests/test_cut_release_read_proof.py"
          for history in 32 10000; do
            negative="$RUNNER_TEMP/release-proof-old-$history.log"
            if uv run --locked --project "$baseline" pytest -c "$baseline/pyproject.toml" "$baseline/tests/test_cut_release_read_proof.py::test_warm_release_poll_uses_bounded_unchanged_proof[unchanged-$history]" -q -s >"$negative" 2>&1; then
              cat "$negative"
              exit 1
            fi
            cat "$negative"
            grep -F "warm release polling materialized $((32 * history)) DTOs for $history actions in 32 polls" "$negative"
            grep -F '1 failed' "$negative"
          done
      - name: Same-snapshot release proof semantics and costs
        shell: bash
        run: uv run --locked --project plugins/long-running pytest plugins/long-running/tests/test_cut_release_read_proof.py plugins/long-running/tests/test_read_snapshot_version.py plugins/long-running/tests/test_open_cut_clock_noop.py plugins/long-running/tests/test_sqlite_action_store.py -q -s --junitxml="$RUNNER_TEMP/release-proof-current.xml" | tee "$RUNNER_TEMP/release-proof-current.log"
      - name: Immutable old release creator and writer visibility
        shell: bash
        env:
          LR_BLOCKER_OLD_SCRIPTS: ${{ github.workspace }}/.ci-release-proof-baseline/plugins/long-running/skills/long-running/scripts
        run: uv run --locked --project plugins/long-running pytest plugins/long-running/tests/release_proof_old_writer_integration.py -q -s --junitxml="$RUNNER_TEMP/release-proof-old-writer.xml" | tee "$RUNNER_TEMP/release-proof-old-writer.log"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-proof-${{ runner.os }}
          path: ${{ runner.temp }}/release-proof-*
          if-no-files-found: error
      - uses: actions/checkout@v7
        with:
          ref: 91c856f8556b4462bb57ca215d34fef8254a92d9
          path: .ci-reader-validation-baseline
          persist-credentials: false
      - name: Immutable reader validation snapshot negative control
        shell: bash
        run: |
          baseline=.ci-reader-validation-baseline/plugins/long-running
          test "$(git -C .ci-reader-validation-baseline rev-parse HEAD)" = 91c856f8556b4462bb57ca215d34fef8254a92d9
          cp plugins/long-running/tests/test_reader_validation_snapshot.py "$baseline/tests/test_reader_validation_snapshot.py"
          negative="$RUNNER_TEMP/reader-validation-old.log"
          if uv run --locked --project "$baseline" pytest -c "$baseline/pyproject.toml" "$baseline/tests/test_reader_validation_snapshot.py::test_every_reader_validation_uses_the_requested_snapshot[fact-scoped-32]" -q -s >"$negative" 2>&1; then
            cat "$negative"
            exit 1
          fi
          cat "$negative"
          grep -F 'reader validation opened 32 implicit snapshots' "$negative"
          grep -F '1 failed' "$negative"
      - name: Reader validation snapshot semantics and costs
        shell: bash
        run: uv run --locked --project plugins/long-running pytest plugins/long-running/tests/test_reader_validation_snapshot.py plugins/long-running/tests/test_sqlite_action_store.py -q -s --junitxml="$RUNNER_TEMP/reader-validation-current.xml" | tee "$RUNNER_TEMP/reader-validation-current.log"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reader-validation-${{ runner.os }}
          path: ${{ runner.temp }}/reader-validation-*
          if-no-files-found: error
      - uses: actions/checkout@v7
        with:
          ref: 05c2ec4e237c066c76ce3f90ad1e3d2d20db3dd0
          path: .ci-merge-waits-baseline
          persist-credentials: false
      - name: Immutable whole-map merge-wait negative controls
        shell: bash
        run: |
          baseline=.ci-merge-waits-baseline/plugins/long-running
          cp plugins/long-running/tests/test_merge_wait_fact_cost.py "$baseline/tests/test_merge_wait_fact_cost.py"
          for history in 32 10000; do
            negative="$RUNNER_TEMP/merge-waits-old-$history.log"
            if uv run --locked --project "$baseline" pytest -c "$baseline/pyproject.toml" "$baseline/tests/test_merge_wait_fact_cost.py::test_unchanged_merge_wait_reads_only_graded_children[$history]" -q -s >"$negative" 2>&1; then
              cat "$negative"
              exit 1
            fi
            cat "$negative"
            grep -F "unchanged merge waits decoded $((2 * (history + 1))) fact values instead of 2" "$negative"
            grep -F '1 failed' "$negative"
          done
      - name: Actual selected-child merge-wait semantics and costs
        shell: bash
        run: uv run --locked --project plugins/long-running pytest plugins/long-running/tests/test_merge_wait_fact_cost.py -q -s --junitxml="$RUNNER_TEMP/merge-waits-current.xml" | tee "$RUNNER_TEMP/merge-waits-current.log"
      - name: Actual old fact creator and writer compatibility
        shell: bash
        env:
          LR_BLOCKER_OLD_SCRIPTS: ${{ github.workspace }}/.ci-merge-waits-baseline/plugins/long-running/skills/long-running/scripts
        run: uv run --locked --project plugins/long-running pytest plugins/long-running/tests/merge_waits_old_writer_integration.py -q -s --junitxml="$RUNNER_TEMP/merge-waits-old-writer.xml" | tee "$RUNNER_TEMP/merge-waits-old-writer.log"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: merge-waits-${{ runner.os }}
          path: ${{ runner.temp }}/merge-waits-*
          if-no-files-found: error
      - uses: actions/checkout@v7
        with:
          ref: 91c856f8556b4462bb57ca215d34fef8254a92d9
          path: .ci-release-cursor-baseline
          persist-credentials: false
      - name: Immutable no-event release writer negative controls
        shell: bash
        run: |
          baseline=.ci-release-cursor-baseline/plugins/long-running
          test "$(git -C .ci-release-cursor-baseline rev-parse HEAD)" = 91c856f8556b4462bb57ca215d34fef8254a92d9
          cp plugins/long-running/tests/test_release_cursor_noop.py "$baseline/tests/test_release_cursor_noop.py"
          for history in 32 10000; do
            negative="$RUNNER_TEMP/release-cursor-old-$history.log"
            if uv run --locked --project "$baseline" pytest -c "$baseline/pyproject.toml" "$baseline/tests/test_release_cursor_noop.py::test_no_event_release_poll_avoids_writer_transaction[read-$history]" -q -s >"$negative" 2>&1; then
              cat "$negative"
              exit 1
            fi
            cat "$negative"
            grep -F 'no-event release polling opened 32 writers for 32 calls' "$negative"
            grep -F '1 failed' "$negative"
          done
      - name: No-event release writer semantics and bounded fact selection
        shell: bash
        run: uv run --locked --project plugins/long-running pytest plugins/long-running/tests/test_release_cursor_noop.py plugins/long-running/tests/test_sqlite_action_store.py -q -s --junitxml="$RUNNER_TEMP/release-cursor-current.xml" | tee "$RUNNER_TEMP/release-cursor-current.log"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-cursor-${{ runner.os }}
          path: ${{ runner.temp }}/release-cursor-*
          if-no-files-found: error
      - uses: actions/checkout@v7
        with:
          ref: a99ff7311aa2d4c71ba696cf608f4ee9fb2b8917
          path: .ci-cut-clock-baseline
          persist-credentials: false
      - name: Immutable unchanged cut clock writer negative controls
        shell: bash
        run: |
          baseline=.ci-cut-clock-baseline/plugins/long-running
          test "$(git -C .ci-cut-clock-baseline rev-parse HEAD)" = a99ff7311aa2d4c71ba696cf608f4ee9fb2b8917
          cp plugins/long-running/tests/test_open_cut_clock_noop.py "$baseline/tests/test_open_cut_clock_noop.py"
          for source in empty existing-release; do
            for history in 32 10000; do
              negative="$RUNNER_TEMP/cut-clock-old-$source-$history.log"
              if uv run --locked --project "$baseline" pytest -c "$baseline/pyproject.toml" "$baseline/tests/test_open_cut_clock_noop.py::test_unchanged_cut_poll_avoids_writer_transaction[$source-open-$history]" -q -s >"$negative" 2>&1; then
                cat "$negative"
                exit 1
              fi
              cat "$negative"
              grep -F 'unchanged cut polling opened 32 writers for 32 calls' "$negative"
              grep -F '1 failed' "$negative"
            done
          done
      - name: Unchanged cut clock writers and clock semantics
        shell: bash
        run: uv run --locked --project plugins/long-running pytest plugins/long-running/tests/test_open_cut_clock_noop.py plugins/long-running/tests/test_release_cursor_noop.py plugins/long-running/tests/test_sqlite_action_store.py -q -s --junitxml="$RUNNER_TEMP/cut-clock-current.xml" | tee "$RUNNER_TEMP/cut-clock-current.log"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cut-clock-${{ runner.os }}
          path: ${{ runner.temp }}/cut-clock-*
          if-no-files-found: error
      - uses: actions/checkout@v7
        with:
          ref: cd0740efe5bd10b0402bd310126cf566bb53a2c5
          path: .ci-admission-direct-baseline
          persist-credentials: false
      - name: Immutable whole-bus admission negative controls
        shell: bash
        run: |
          baseline=.ci-admission-direct-baseline/plugins/long-running
          cp plugins/long-running/tests/test_admission_direct_merge_cost.py "$baseline/tests/test_admission_direct_merge_cost.py"
          for history in 32 10000; do
            negative="$RUNNER_TEMP/admission-direct-merge-old-$history.log"
            if uv run --locked --project "$baseline" pytest -c "$baseline/pyproject.toml" "$baseline/tests/test_admission_direct_merge_cost.py::test_admission_avoids_unrelated_bus_history[$history]" -q -s >"$negative" 2>&1; then
              cat "$negative"
              exit 1
            fi
            cat "$negative"
            grep -F "direct-merge admission decoded $((history + 6)) actions instead of 6 candidates" "$negative"
            grep -F '1 failed' "$negative"
          done
      - name: Actual admission bounded history and indexless semantics
        shell: bash
        run: uv run --locked --project plugins/long-running pytest plugins/long-running/tests/test_admission_direct_merge_cost.py -q -s --junitxml="$RUNNER_TEMP/admission-direct-merge-current.xml" | tee "$RUNNER_TEMP/admission-direct-merge-current.log"
      - name: Actual old direct-merge writer and creator compatibility
        shell: bash
        env:
          LR_BLOCKER_OLD_SCRIPTS: ${{ github.workspace }}/.ci-admission-direct-baseline/plugins/long-running/skills/long-running/scripts
        run: uv run --locked --project plugins/long-running pytest plugins/long-running/tests/direct_merge_old_writer_integration.py -q -s --junitxml="$RUNNER_TEMP/admission-direct-merge-old-writer.xml" | tee "$RUNNER_TEMP/admission-direct-merge-old-writer.log"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: admission-direct-merge-${{ runner.os }}
          path: ${{ runner.temp }}/admission-direct-merge-*
          if-no-files-found: error
      - name: Disabled and bounded one-pass native IO diagnostic
        run: uv run --locked --project plugins/long-running pytest plugins/long-running/tests/test_pass_io.py -q -s --junitxml="$RUNNER_TEMP/one-pass-io.xml"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: one-pass-io-${{ runner.os }}
          path: ${{ runner.temp }}/one-pass-io.xml
          if-no-files-found: error
      - uses: actions/checkout@v7
        with:
          ref: 72a91ecd4a1a26a4666e39a7f0f8237444359c53
          path: .ci-heartbeat-lifecycle-baseline
          persist-credentials: false
      - name: Immutable returned heartbeat worker negative controls
        run: |
          baseline=.ci-heartbeat-lifecycle-baseline/plugins/long-running
          cp plugins/long-running/tests/test_desk_runner.py "$baseline/tests/test_desk_runner.py"
          for desk in orca landing; do
            negative="$RUNNER_TEMP/heartbeat-lifecycle-old-$desk.log"
            if uv run --locked --project "$baseline" pytest -c "$baseline/pyproject.toml" "$baseline/tests/test_desk_runner.py" -k "test_controller_return_stops_its_real_heartbeat and once and $desk" -q >"$negative" 2>&1; then
              cat "$negative"
              exit 1
            fi
            cat "$negative"
            grep -F 'returned controller left its heartbeat stop event unset' "$negative"
            grep -F '1 failed' "$negative"
          done
      - name: Actual controller heartbeat success and error teardown
        run: uv run --locked --project plugins/long-running pytest plugins/long-running/tests/test_desk_runner.py::test_controller_return_stops_its_real_heartbeat -q -s --junitxml="$RUNNER_TEMP/controller-heartbeat-lifetime.xml" -o junit_family=xunit1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: controller-heartbeat-lifetime-${{ runner.os }}
          path: |
            ${{ runner.temp }}/controller-heartbeat-lifetime.xml
            ${{ runner.temp }}/heartbeat-lifecycle-old-*.log
          if-no-files-found: error
      - uses: actions/checkout@v7
        with:
          ref: 55b1b01654e37be57b7c2d102f5b4492a7fec1a5
          path: .ci-reader-working-set-baseline
          persist-credentials: false
      - name: Immutable cyclic reader working-set negative controls
        run: |
          baseline=.ci-reader-working-set-baseline/plugins/long-running
          cp plugins/long-running/tests/test_reader_working_set.py "$baseline/tests/test_reader_working_set.py"
          for lanes in 63 64; do
            negative="$RUNNER_TEMP/reader-working-set-lanes-$lanes-negative.log"
            if uv run --locked --project "$baseline" pytest -c "$baseline/pyproject.toml" "$baseline/tests/test_reader_working_set.py::test_actual_refusal_reader_working_set_boundary[lanes-$lanes-seed-0]" -q -s >"$negative" 2>&1; then
              cat "$negative"
              exit 1
            fi
            cat "$negative"
            grep -F "cyclic reader working set reopened $(((lanes + 2) * 16)) connections" "$negative"
            grep -F '1 failed' "$negative"
          done
      - name: Actual bounded reader working-set costs and changed-phase adaptation
        shell: bash
        run: uv run --locked --project plugins/long-running pytest plugins/long-running/tests/test_reader_working_set.py plugins/long-running/tests/test_sqlite_action_store.py -q -s --junitxml="$RUNNER_TEMP/reader-working-set-current.xml" | tee "$RUNNER_TEMP/reader-working-set-current.log"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reader-working-set-${{ runner.os }}
          path: ${{ runner.temp }}/reader-working-set-*
      - uses: actions/checkout@v7
        with:
          ref: 2ef339b0d78951d89000b3f012b65905dc852b52
          path: .ci-verified-cause-baseline
          persist-credentials: false
      - name: Immutable closed blocker cause negative controls
        run: |
          baseline=.ci-verified-cause-baseline/plugins/long-running
          cp plugins/long-running/tests/test_desk_runner.py "$baseline/tests/test_desk_runner.py"
          for receipt in closed resolved; do
            negative="$RUNNER_TEMP/verified-cause-$receipt-negative.log"
            if uv run --locked --project "$baseline" pytest -c "$baseline/pyproject.toml" "$baseline/tests/test_desk_runner.py::test_posted_blocker_cause_stays_available_after_verification[$receipt]" -q >"$negative" 2>&1; then
              cat "$negative"
              exit 1
            fi
            cat "$negative"
            grep -F 'verified posted blocker disappeared from cause history' "$negative"
            grep -F '1 failed' "$negative"
          done
          negative="$RUNNER_TEMP/verified-cause-race-negative.log"
          if uv run --locked --project "$baseline" pytest -c "$baseline/pyproject.toml" "$baseline/tests/test_desk_runner.py::test_same_red_cause_uses_original_blocker_after_cleanup_wins_the_race" -q >"$negative" 2>&1; then
            cat "$negative"
            exit 1
          fi
          cat "$negative"
          grep -F 'cleanup-before-cause lookup duplicated original blocker' "$negative"
