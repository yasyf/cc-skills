name: Plugin autobump CI

on:
  push:
    branches: [main]
    paths:
      - ".github/scripts/plugin_autobump.py"
      - ".github/scripts/release_tag.py"
      - "plugins/repo-bootstrap/tests/test_release_tag.py"
      - ".github/workflows/plugin-autobump.yml"
      - ".github/workflows/autobump.yml"
      - ".github/workflows/plugin-autobump-ci.yml"
      - ".github/workflows/plugin-release-tag.yml"
      - "plugins/repo-bootstrap/tests/test_plugin_autobump.py"
  pull_request:
    paths:
      - ".github/scripts/plugin_autobump.py"
      - ".github/scripts/release_tag.py"
      - "plugins/repo-bootstrap/tests/test_release_tag.py"
      - ".github/workflows/plugin-autobump.yml"
      - ".github/workflows/autobump.yml"
      - ".github/workflows/plugin-autobump-ci.yml"
      - ".github/workflows/plugin-release-tag.yml"
      - "plugins/repo-bootstrap/tests/test_plugin_autobump.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # TODO: drop once this job runs green on CPython 3.15; uv 0.13.0 defaults to 3.15.
      UV_PYTHON: "3.14"
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v8.2.0

      - name: Test plugin autobump
        run: uvx pytest plugins/repo-bootstrap/tests/test_plugin_autobump.py plugins/repo-bootstrap/tests/test_release_tag.py -q
