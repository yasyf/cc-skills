name: live-dashboard CI

on:
  push:
    branches: [main]
    tags: ["live-dashboard--v*"]
    paths:
      - "plugins/live-dashboard/**"
      - ".github/workflows/live-dashboard-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "plugins/live-dashboard/**"
      - ".github/workflows/live-dashboard-ci.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # TODO: drop once this job runs green on CPython 3.15; uv 0.13.0 defaults to 3.15.
      UV_PYTHON: "3.14"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.2.0
      - name: pytest
        run: uv run --project plugins/live-dashboard pytest plugins/live-dashboard/tests -q
      - name: catalog is current
        run: python3 plugins/live-dashboard/skills/live-dashboard/scripts/live-dashboard.py catalog --check
