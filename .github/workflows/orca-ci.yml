name: orca CI

on:
  push:
    branches: [main]
    paths:
      - "plugins/orca/**"
      - ".github/workflows/orca-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "plugins/orca/**"
      - ".github/workflows/orca-ci.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.2.0
      - name: unittest
        run: uv run --no-project --python 3.14 python -m unittest discover -s plugins/orca/tests -v
