name: Autobump

on:
  push:
    branches: [main]
    paths: ["plugins/**", "!plugins/long-running/lr/**"]
  schedule:
    - cron: "23 10 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        default: false
      strict:
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  autobump:
    uses: ./.github/workflows/plugin-autobump.yml
    with:
      dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
      strict: ${{ github.event_name == 'workflow_dispatch' && inputs.strict || false }}
      guard-plugins: "codex slop-cop"
      lockstep: "plugins/long-running/bin/lr.binrun plugins/long-running/lr"
      lockstep-check: "uv run --locked --project plugins/long-running pytest plugins/long-running/tests/test_lr_verbs.py"

  publish:
    needs: autobump
    if: github.event_name == 'workflow_dispatch' && !inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: A run GITHUB_TOKEN dispatched fires no workflow_run, so start the pack release from here
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run long-running-pack-release.yml --ref main --repo "$GITHUB_REPOSITORY"
